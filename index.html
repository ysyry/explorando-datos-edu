  corregir después: lo que no mediste en su momento ya no lo podés recuperar.</div>`},

{k:'La cadena',t:'El recorrido completo del dato',h:`
  <div class="flow">
    <div class="fnode i"><div class="fh">SENSAR</div><div class="fs">el sensor mide y entrega un número crudo</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">CONVERTIR</div><div class="fs">ese número se vuelve una magnitud con unidad</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">GUARDAR</div><div class="fs">con su fecha y hora, en un CSV o una base</div></div>
  </div>
  <div class="flow">
    <div class="fnode p"><div class="fh">ANALIZAR</div><div class="fs">acá entra todo lo que ya sabemos hacer</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">DECIDIR</div><div class="fs">una regla compara y elige</div></div>
    <div class="farr">→</div>
    <div class="fnode o"><div class="fh">ACTUAR</div><div class="fs">algo pasa en el mundo físico</div></div>
  </div>
  <div class="big">Los tres primeros pasos son nuevos para nosotros. Los tres últimos ya los venimos
  haciendo, solo que a mano y después de los hechos.<br><br>
  <b>Automatizar es cerrar esa cadena para que gire sola.</b></div>`},

{k:'Conversión',t:'Del número crudo a la magnitud',h:`
  <div class="big">El sensor entrega un número sin unidad. Para convertirlo en algo que se entienda
  necesitás <b>dos mediciones de referencia</b>, una en cada extremo.</div>
  <div class="serie">al aire, tierra 0% húmeda     el sensor marca   820
  en agua, tierra 100% húmeda   el sensor marca   350</div>
  <div class="big">Lo primero que salta a la vista: en este sensor <b>más humedad da un número más
  chico</b>. Va al revés de lo que uno esperaría.<br><br>
  Entre 820 y 350 hay <b>470 unidades de diferencia</b>. Esas 470 unidades son todo el recorrido del
  sensor, de seco a mojado. O sea que <b>470 unidades equivalen al 100%</b>.</div>
  <div class="big" style="margin-top:14px">Supongamos que ahora marca <b>585</b>. Dos preguntas:</div>
  <div class="serie">¿Cuánto se alejó del punto seco?      820 - 585  =  235 unidades
  ¿Qué parte del recorrido es eso?      235 de 470  =  la mitad  =  50%</div>
  <div class="big">Esos dos pasos, escritos de una sola vez:</div>
  <div class="serie">humedad = (820 - lectura) * 100 / 470

  la resta   (820 - lectura)   dice cuánto te alejaste de seco
  la división      / 470       dice qué fracción del recorrido total es
  el          * 100            lo pasa a porcentaje</div>
  <div class="big">Comprobala con los tres casos:</div>
  <div class="serie">lectura 820   →   (820 - 820) * 100 / 470   =     0%
  lectura 585   →   (820 - 585) * 100 / 470   =    50%
  lectura 350   →   (820 - 350) * 100 / 470   =   100%</div>
  <div class="big">Esto es una <b>función lineal</b>: dos puntos conocidos, una pendiente, una recta.
  La misma que ven en Matemática. Acá la pendiente es negativa, y eso es lo que hace que el número
  baje cuando la humedad sube.</div>
  <div class="hint">El 820 y el 350 salen de <b>tu</b> sensor. Otro sensor del mismo modelo va a dar
  otros dos números, así que la calibración se hace uno por uno, no por tipo de sensor.
  Si no calibrás y asumís que el número crece con la humedad, el aparato riega justo al revés.</div>`},

{k:'Datos con tiempo',t:'Series temporales',h:`
  <div class="big">Hasta ahora nuestras tablas eran fotos: una fila por provincia, una por mes.
  Un sensor produce otra cosa: <b>el mismo dato repetido en el tiempo</b>. Eso se llama serie temporal
  y trae conceptos nuevos.</div>
  <div class="glos">
    <div><b>Tendencia.</b> Hacia dónde va en el largo plazo. La tierra se va secando durante la semana.</div>
    <div><b>Estacionalidad.</b> Lo que se repite con un ciclo. Todos los días baja de madrugada y sube al mediodía.</div>
    <div><b>Ruido.</b> Variaciones chicas sin significado. Que salte de 512 a 514 no quiere decir nada.</div>
    <div><b>Outlier.</b> Un valor que se sale de todo. Entre puros 18 y 22 aparece un 850.</div>
  </div>
  <div class="big" style="margin-top:14px">Un problema frecuente es <b>reaccionar al ruido</b>: si el aparato
  decide con una sola lectura, cualquier chispazo lo hace actuar. La solución habitual es promediar las
  últimas mediciones y decidir con ese promedio.</div>`},

{k:'Control',t:'Lazo abierto y lazo cerrado',h:`
  <div class="lazo">
    <div class="box"><h4>Lazo abierto</h4>
      <div style="font-size:.96rem;line-height:1.7">Actúa sin fijarse en el resultado.
      <br><br><i>Regar 5 minutos todos los días a las 8.</i><br><br>
      Simple y barato. Pero riega igual bajo la lluvia, y si se tapó la manguera nunca se entera.</div></div>
    <div class="box"><h4>Lazo cerrado</h4>
      <div style="font-size:.96rem;line-height:1.7">Mide, actúa, y <b>vuelve a medir para ver si funcionó</b>.
      <br><br><i>Regar hasta que la humedad llegue a 60%.</i><br><br>
      Se adapta solo. Es lo que hace que un sistema sea inteligente y no apenas automático.</div></div>
  </div>
  <div class="big">La diferencia es la <b>realimentación</b>: el resultado de la acción vuelve a entrar
  como información. Un termostato, el control de crucero de un auto y el piloto automático de un avión
  son todos lazos cerrados.<br><br>
  Un lazo cerrado <b>necesita un límite de seguridad</b>. Si el sensor se rompe y siempre
  marca seco, el sistema riega para siempre y te inunda todo.</div>`},

{k:'Control',t:'Histéresis: por qué un umbral no alcanza',h:`
  <div class="big">Tu regla dice: <i>si la humedad baja de 40%, regar; si sube de 40%, parar.</i>
  Parece razonable y sin embargo falla feo.</div>
  <div class="serie">humedad:  39.8  →  riega  →  40.1  →  para  →  39.9  →  riega  →  40.2  →  para
                       (y así cien veces por minuto)</div>
  <div class="big">Cuando el valor queda oscilando justo en el umbral, el relé prende y apaga sin parar.
  Se llama <b>castañeteo</b>, y quema el relé y la bomba en poco tiempo.<br><br>
  La solución se llama <b>histéresis</b>: usar <b>dos umbrales distintos</b>.</div>
  <div class="serie">si humedad < 35    →  empezar a regar
  si humedad > 50    →  dejar de regar
  entre 35 y 50      →  seguir haciendo lo que ya estaba haciendo</div>
  <div class="hint">Es el mismo truco del termostato de una estufa o de la heladera: prenden a una
  temperatura y cortan a otra distinta. Nunca al mismo número.</div>`},

{k:'Arquitectura',t:'¿Dónde se procesa? Edge o nube',h:`
  <div class="two">
    <div class="box"><h4>En el borde (edge)</h4>
      <div style="font-size:.95rem;line-height:1.7">La placa decide sola, ahí mismo.<br>
      Anda sin internet. Responde al instante. Los datos no salen del lugar.<br>
      Pero tiene poca capacidad y para ver los datos hay que ir hasta ahí.</div></div>
    <div class="box"><h4>En la nube</h4>
      <div style="font-size:.95rem;line-height:1.7">La placa manda los datos a un servidor y allá se procesa.<br>
      Podés ver todo desde el celular, guardar años de historia, cruzar con otras fuentes.<br>
      Pero depende de la conexión, y los datos quedan en la máquina de otro.</div></div>
  </div>
  <div class="big">Casi todos los sistemas reales son <b>mixtos</b>: la decisión urgente se toma en el borde
  (si hay fuego, cortá todo, sin preguntarle a nadie) y el análisis histórico se hace en la nube.<br><br>
  En un lugar como Villa La Angostura hay un argumento extra para el borde: <b>la conexión se cae</b>.
  Un sistema que necesita internet para regar es un sistema que un día no riega.</div>`},

{k:'Soberanía',t:'¿De quién son los datos del sensor?',h:`
  <div class="big">Comprás un sensor de humedad para la huerta de la escuela. Viene con una app.
  La app pide una cuenta. Los datos van a un servidor en otro país.<br><br>
  Preguntas que hay que hacerse <b>antes</b> de instalar, no después:</div>
  <div class="glos">
    <div>¿Puedo <b>bajar mis datos</b> en un archivo, o quedan encerrados en la app?</div>
    <div>Si la empresa cierra o cambia el precio, <b>¿pierdo el historial</b>?</div>
    <div>¿El aparato <b>sigue funcionando sin internet</b> o se convierte en un ladrillo?</div>
    <div>¿Qué más manda además de la humedad? ¿Ubicación? ¿Cada cuánto?</div>
    <div>¿Puedo <b>ver el código</b> y modificarlo, o es una caja negra?</div>
  </div>
  <div class="big" style="margin-top:14px">Con Arduino y software libre las respuestas son claras:
  los datos quedan en un CSV tuyo, el aparato anda sin internet, y el código lo escribiste vos.
  Elegir una herramienta u otra tiene consecuencias que van más allá de lo técnico.</div>`},

{k:'Casos',t:'Esto ya está pasando',h:`
  <div class="glos">
    <div><b>Agricultura de precisión.</b> Sensores de humedad y estaciones meteorológicas deciden cuánto
    regar por sector. En zonas con poca agua no es un lujo: es la diferencia entre producir o no.</div>
    <div><b>Turismo y ambiente.</b> Contadores automáticos de personas en senderos de parques nacionales,
    para saber cuánta gente aguanta un lugar sin degradarse. Es exactamente el tipo de dato que a nosotros
    nos faltaba y que nadie publica.</div>
    <div><b>Calidad de agua en lagos.</b> Boyas con sensores de temperatura y turbidez que detectan
    floraciones de algas antes de que se vean a simple vista.</div>
    <div><b>Monitoreo de heladas.</b> En fruticultura, una red de sensores avisa qué cuadros están en
    riesgo esta noche, y en algunos casos prende los sistemas de defensa sola.</div>
  </div>
  <div class="hint">En los cuatro casos <b>el dato no existía antes</b>. No estaba escondido en ningún
  lado: nadie lo había medido todavía.</div>`},

{k:'Fallas',t:'Cuando el sistema miente',h:`
  <div class="big">Un aparato roto que se apaga es un problema chico: te das cuenta. El problema grave es
  el <b>fallo silencioso</b>: sigue funcionando y sigue mandando números, pero son mentira.</div>
  <div class="glos">
    <div><b>Sensor sucio o corroído.</b> Sigue midiendo, pero cada vez más corrido. La deriva no avisa.</div>
    <div><b>Cable flojo.</b> Devuelve 0. Y 0 es un número perfectamente válido: el sistema lo cree.</div>
    <div><b>Sensor mal ubicado.</b> Mide bien, pero mide el lugar equivocado. El termómetro al sol.</div>
    <div><b>Sesgo de instalación.</b> Todos los sensores puestos en la parte buena del campo. Los datos
    son reales y la conclusión igual está mal.</div>
  </div>
  <div class="big" style="margin-top:14px">Por eso un sistema serio no solo mide: <b>se controla a sí mismo</b>.
  Si el valor está fuera del rango posible, si no cambió en dos días, o si dejaron de llegar datos,
  tiene que avisar. Que dejen de llegar datos también es información.</div>`},

{k:'Decisiones',t:'Qué automatizar, y quién decide',h:`
  <div class="big">Automatizar no es neutral. Cada vez que una máquina toma una decisión, alguien dejó
  de tomarla, y alguien programó el criterio.</div>
  <div class="glos">
    <div><b>¿Qué conviene automatizar?</b> Lo repetitivo, lo peligroso y lo que hay que hacer a las tres
    de la mañana. Lo aburrido para una persona suele ser perfecto para una máquina.</div>
    <div><b>¿Qué conviene NO automatizar?</b> Lo que requiere juicio, lo que tiene consecuencias graves
    si falla, y lo que le da sentido al trabajo de alguien.</div>
    <div><b>¿Quién puso el umbral?</b> Si el sistema riega abajo de 35%, alguien eligió ese 35.
    Ese número es una decisión humana disfrazada de dato técnico.</div>
    <div><b>¿Quién se queda con lo que se ahorra?</b> Si un sistema hace el trabajo de tres personas,
    la pregunta de qué pasa con esas tres personas no la contesta la ingeniería.</div>
  </div>
  <div class="hint">Es lo mismo que discutimos con la IA: la herramienta no decide sola, siempre hay
  alguien atrás que eligió el criterio.</div>`},

{k:'Glosario',t:'Vocabulario del campo',h:`
  <div class="glos">
    <div><b>Microcontrolador</b> — computadora chica sin sistema operativo, corre un solo programa desde que se enciende.</div>
    <div><b>GPIO</b> — los pines de entrada/salida de propósito general de la placa.</div>
    <div><b>Analógico / digital</b> — un valor dentro de un rango, contra dos estados posibles.</div>
    <div><b>ADC</b> — el conversor que transforma un voltaje en un número. El que produce el 0 a 1023.</div>
    <div><b>PWM</b> — prender y apagar muy rápido para simular valores intermedios. Media luz, medio motor.</div>
    <div><b>Actuador</b> — lo que convierte una orden eléctrica en algo físico.</div>
    <div><b>Relé</b> — interruptor manejado eléctricamente. Permite que 5 voltios controlen 220.</div>
    <div><b>Umbral</b> — el valor a partir del cual el sistema cambia de comportamiento.</div>
    <div><b>Histéresis</b> — usar dos umbrales distintos para evitar el castañeteo.</div>
    <div><b>Lazo cerrado</b> — el sistema mide el resultado de su propia acción y se corrige.</div>
    <div><b>Datalogger</b> — el que guarda las mediciones con su fecha y hora.</div>
    <div><b>Telemetría</b> — mandar mediciones a distancia.</div>
    <div><b>Latencia</b> — cuánto tarda el sistema en reaccionar.</div>
    <div><b>Calibración</b> — ajustar el instrumento contra un valor conocido.</div>
    <div><b>Deriva</b> — el corrimiento lento de un sensor con el paso del tiempo.</div>
  </div>`},

{k:'Cierre',t:'Lo que cambia de acá en adelante',h:`
  <div class="big">Veníamos preguntándole cosas a una tabla. De ahora en más también vamos a preguntarnos
  <b>de dónde salió esa tabla</b>, y en algún momento vamos a construir la cosa que la produce.<br><br>
  Todo lo que aprendieron sigue sirviendo igual: filtrar, agrupar, graficar, distinguir observación de
  interpretación. Lo que se suma es el otro extremo de la cadena.<br><br>
  Y con eso se suma una responsabilidad nueva: cuando el dato lo producís vos, <b>los errores también
  son tuyos</b>. Un sensor mal calibrado, mal ubicado o mal muestreado produce datos que parecen
  perfectos y no lo son.</div>
  <div class="hint">Los dos bancos de ejercicios que siguen son para eso: el primero conecta lo que ya
  saben de datos con esta manera de pensar. El segundo entra en la electrónica y el vocabulario.</div>`}
];

const NAV4=['Apertura','Procedencia del dato','El sensor como instrumento','Muestreo','La cadena del dato',
 'Conversión y calibración','Series temporales','Lazo abierto y cerrado','Histéresis','Edge o nube',
 'Soberanía de los datos','Casos reales','Cuando el sistema miente','Qué automatizar','Vocabulario','Cierre'];

let CUR4=-1;
function nav4HTML(cur){
  const items=DST.map((s,i)=>'<div class="iso '+(i===cur?'cur':'')+'" onclick="d4Go('+i+')">'+
    '<span class="isn">'+(i+1)+'</span><span>'+NAV4[i]+'</span></div>').join('');
  return '<aside class="iside"><div class="sh">De los datos al sistema</div>'+items+
    '<div class="isidefoot"><a onclick="s4Home()">← Volver al módulo</a>'+
    '<a onclick="portal()">Ir al panel general</a></div></aside>';
}
function d4Go(i){
  fichaBtn.style.display="none"; roboMode(true); CURI=-1;
  if(i<0)i=0; if(i>=DST.length) return s4Home();
  CUR4=i;
  const s=DST[i];
  setHead("De los datos al sistema", (i+1)+" de "+DST.length+" · 4to año");
  app.innerHTML='<div class="ilay">'+nav4HTML(i)+'<div><div class="icard">'+
    '<div class="topbar"><i style="width:'+((i+1)/DST.length*100)+'%"></i></div>'+
    '<div class="kicker">'+s.k+'</div><h2 class="ih">'+s.t+'</h2>'+s.h+
    '<div class="navb">'+(i>0?'<button class="btn ghost" onclick="d4Go('+(i-1)+')">← Anterior</button>':'')+
    '<button class="btn" onclick="d4Go('+(i+1)+')">'+(i+1>=DST.length?'Terminar':'Siguiente →')+'</button></div>'+
    '<div class="kbhint">Podés avanzar con las flechas del teclado</div>'+
    '</div></div></div>';
  window.scrollTo(0,0);
}
if(typeof document.addEventListener==="function")document.addEventListener("keydown",function(e){
  if(CUR4<0)return;
  const t=(e.target&&e.target.tagName)||"";
  if(t==="INPUT"||t==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();d4Go(CUR4+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();d4Go(CUR4-1)}
});

function s4Home(){
  fichaBtn.style.display="none"; roboMode(true); CUR4=-1; CURI=-1;
  setHead("De los datos al sistema","4to año · del análisis a la automatización");
  app.innerHTML='<div class="rowrap">'+
    '<div class="trackcard" onclick="d4Go(0)" style="margin-bottom:14px">'+
      '<div class="tg">Empezá por acá</div><h3>Presentación · 16 pantallas</h3>'+
      '<p>De dónde sale un dato, el sensor como instrumento de medición, muestreo, calibración, series '+
      'temporales, lazo cerrado e histéresis, edge o nube, soberanía de los datos, casos reales y fallos silenciosos.</p></div>'+
    '<div class="trackcard" onclick="quizStart(EJ_DATOS,\'Del dato al sistema\',\'s4Home()\')" style="margin-bottom:14px">'+
      '<div class="tg">Banco 1 · '+EJ_DATOS.length+' ejercicios</div><h3>De los datos al sistema</h3>'+
      '<p>Situaciones con datos reales de turismo, huerta y ambiente. Procedencia, muestreo, outliers, '+
      'calibración, series temporales, Python y recetas de consulta. Conecta lo que ya saben con lo nuevo.</p></div>'+
    '<div class="trackcard" onclick="quizStart(EJ_ELEC,\'Electrónica, control y vocabulario\',\'s4Home()\')" style="margin-bottom:14px">'+
      '<div class="tg">Banco 2 · '+EJ_ELEC.length+' ejercicios</div><h3>Electrónica, control y vocabulario</h3>'+
      '<p>Circuitos, pines, relés, PWM, lazo cerrado, histéresis y fallos. Situaciones para resolver '+
      'y vocabulario técnico del campo.</p></div>'+
    '<div class="trackcard" onclick="quizStart(EJ_TIERRAS,\'Ley de tierras: leer el territorio\',\'s4Home()\')" style="margin-bottom:14px">'+
      '<div class="tg">Caso real · '+EJ_TIERRAS.length+' ejercicios</div><h3>Ley de tierras: leer el territorio</h3>'+
      '<p>Datos del Registro Nacional de Tierras Rurales, departamento por departamento. Lácar, el de al '+
      'lado, tiene el 54% de su tierra rural en manos extranjeras y el promedio nacional es 4,97%. '+
      'Qué esconde un promedio, y por qué que el dato exista es una decisión política.</p></div>'+
    '<button class="btn ghost" onclick="portal()">← Volver al panel</button></div>';
  window.scrollTo(0,0);
}


/* =========================================================================
   MÓDULO DE ROBÓTICA — "Cuerpos que se mueven"
   ========================================================================= */
const RST=[
{k:'Arrancamos',t:'Lo que cambia cuando el aparato se mueve',h:`
  <div class="big">Hasta acá pensamos aparatos <b>quietos</b>: un sensor mide, una regla decide, algo
  se prende. Toda la dificultad estaba en la decisión.<br><br>
  Un robot agrega algo que parece menor y no lo es: <b>tiene cuerpo y ese cuerpo se mueve</b>.
  Y en cuanto algo se mueve aparecen problemas que antes no existían.</div>
  <div class="glos">
    <div>Moverse gasta <b>fuerza</b>, y la fuerza gasta corriente. Empiezan a importar las baterías.</div>
    <div>El robot tiene que saber <b>dónde está</b>, y no hay nadie que se lo diga.</div>
    <div>Puede <b>chocar</b>, trabarse, volcarse, y puede lastimar a alguien.</div>
    <div>Entre que decide y que la rueda gira <b>pasa tiempo</b>, y en ese tiempo el mundo cambió.</div>
  </div>`},

{k:'Anatomía',t:'Morfología y grados de libertad',h:`
  <div class="big">El <b>grado de libertad</b> es cada movimiento independiente que un robot puede hacer.
  Una articulación que gira es uno. Un brazo con tres articulaciones tiene tres.</div>
  <div class="big" style="margin-top:14px">Cuantos más grados de libertad, a más posiciones llega, y
  más difícil se vuelve programarlo: hay muchas combinaciones distintas de articulaciones que dejan la
  mano en el mismo lugar, y hay que elegir una.<br><br>
  El brazo humano, del hombro a la muñeca, tiene siete. Un brazo industrial típico tiene seis, que es
  el mínimo para llegar a cualquier punto con cualquier orientación.</div>
  <div class="hint">A la parte del final, la que hace el trabajo, se le dice <b>efector final</b>:
  una pinza, una ventosa, un soplete, un pincel. El brazo lleva el efector hasta donde tiene que estar.</div>`},

{k:'Familias',t:'No todos los robots se parecen',h:`
  <div class="plc">
    <div class="p1"><div class="pn2">Brazo industrial</div>
      <div class="pd">Atornillado al piso, repite el mismo movimiento con una precisión de décimas de
      milímetro, millones de veces. Es el robot más común del mundo y el que menos parece uno.</div></div>
    <div class="p1"><div class="pn2">Robot móvil</div>
      <div class="pd">Se desplaza. Un problema completamente distinto: tiene que saber dónde está,
      esquivar cosas y no quedarse sin batería lejos del enchufe.</div></div>
    <div class="p1"><div class="pn2">Dron</div>
      <div class="pd">Móvil en tres dimensiones. Si el control falla, no se queda quieto: se cae.
      Corrige su posición cientos de veces por segundo solo para mantenerse en el aire.</div></div>
    <div class="p1"><div class="pn2">Robots blandos</div>
      <div class="pd">De materiales flexibles, inflados con aire. Sirven para agarrar cosas frágiles,
      como una fruta madura, donde una pinza rígida arruinaría todo.</div></div>
  </div>`},

{k:'Motores',t:'Cuál motor para cada cosa',h:`
  <div class="glos">
    <div><b>Motor de corriente continua.</b> Gira y gira mientras le des corriente. Rápido y con poca
    fuerza, por eso casi siempre lleva una caja reductora que le baja las vueltas y le sube el empuje.
    No sabe en qué posición está. Es el motor de las ruedas.</div>
    <div><b>Servo.</b> Le pedís un ángulo y va a ese ángulo. Adentro tiene un motor, una reductora y un
    sensor de posición con su propio control. Casi todos giran solo unos 180 grados. Es el motor de una
    ventanita, una pinza, una articulación.</div>
    <div><b>Motor paso a paso.</b> Avanza de a fracciones fijas de vuelta y las podés contar. Sabés
    dónde está sin ningún sensor. Es el motor de una impresora 3D.</div>
  </div>
  <div class="hint">La pregunta que ordena la elección es siempre la misma: <b>¿necesito que gire, o
  necesito que llegue a una posición?</b></div>`},

{k:'Electrónica',t:'La placa no mueve un motor',h:`
  <div class="big">Un pin de la placa entrega unos <b>20 miliamperes</b>. Un motor chico pide
  <b>cientos</b>, y en el arranque muchos más. Si lo conectás directo, quemás el pin y quizás la placa.</div>
  <div class="big" style="margin-top:14px">Entre la placa y el motor va siempre un <b>driver</b>:
  un circuito que recibe una señal chiquita de control y maneja la corriente grande. La placa manda la
  orden, el driver hace la fuerza.<br><br>
  El driver más común es el <b>puente H</b>. El nombre viene del dibujo del circuito: cuatro llaves
  formando una H con el motor en el medio. Según qué par de llaves cierre, la corriente atraviesa el
  motor en un sentido o en el otro, y así el motor gira para adelante o para atrás.</div>
  <div class="hint">Sin puente H, un motor solo puede girar para un lado. Con puente H y PWM,
  además, podés controlar la velocidad.</div>`},

{k:'Energía',t:'El problema de la alimentación',h:`
  <div class="big">Este es el error que más tiempo hace perder a todo el mundo, y da un síntoma
  desconcertante: <b>el robot se reinicia solo justo cuando arrancan los motores</b>.</div>
  <div class="big" style="margin-top:14px">Lo que pasa es que el arranque de un motor pide un pico de
  corriente enorme. Si comparte fuente con la placa, la tensión se desploma un instante, la placa se
  queda sin lo que necesita y se reinicia. El programa no tiene nada que ver.</div>
  <div class="glos" style="margin-top:14px">
    <div><b>Fuentes separadas.</b> Una para la placa, otra para los motores.</div>
    <div><b>Masa común.</b> Los GND de las dos fuentes tienen que estar unidos. Sin eso no hay una
    referencia compartida y las señales de control no significan nada para el driver.</div>
    <div><b>Autonomía.</b> Los motores son lo que se come la batería. Cuánto dura el robot es una
    decisión de diseño, no algo que se descubre después.</div>
  </div>`},

{k:'Movimiento',t:'Cómo dobla un robot sin volante',h:`
  <div class="big">La mayoría de los robots móviles chicos usan <b>tracción diferencial</b>: dos ruedas
  motorizadas, una de cada lado, y una rueda loca que solo hace equilibrio. No hay volante ni dirección.</div>
  <div class="serie">las dos ruedas a la misma velocidad     →  avanza derecho
  la izquierda más rápido que la derecha  →  dobla a la derecha
  una para adelante y la otra para atrás  →  gira sobre su propio eje
  las dos para atrás                      →  retrocede</div>
  <div class="big">Girar en el lugar es algo que un auto no puede hacer, y para un robot que trabaja en
  espacios chicos es una ventaja enorme.<br><br>
  Es la misma idea que usan una excavadora y un tanque, que tampoco tienen volante.</div>`},

{k:'Ubicación',t:'Odometría: saber dónde estás',h:`
  <div class="big">Si contás cuánto giró cada rueda, podés calcular cuánto avanzaste y cuánto rotaste.
  Eso es <b>odometría</b>, y es la forma más barata de que un robot sepa dónde está.</div>
  <div class="big" style="margin-top:14px">Tiene un problema serio: <b>el error se acumula</b>.
  La rueda patina un poquito, el piso tiene una irregularidad, una rueda es un pelo más grande que la
  otra. Cada error es mínimo, pero ninguno se corrige nunca: se van sumando.<br><br>
  Después de unos minutos el robot cree estar en un lugar y está en otro, con total convicción.</div>
  <div class="hint">Por eso los robots serios combinan la odometría con alguna <b>referencia externa</b>
  que la corrija cada tanto: una pared conocida, una marca en el piso, una baliza, GPS. La odometría
  dice cuánto te moviste; la referencia dice dónde estás de verdad.</div>`},

{k:'Percepción',t:'Cómo mira el robot',h:`
  <div class="two">
    <div class="box"><h4>Sin tocar</h4>
      <div style="font-size:.95rem;line-height:1.7">
      <b>Ultrasonido:</b> manda un pulso y cronometra el eco. Mide distancia. Le cuestan las superficies
      blandas y las inclinadas.<br><br>
      <b>Infrarrojo:</b> más rápido y más barato, pero le afecta el sol y el color de lo que mira.<br><br>
      <b>Cámara:</b> muchísima información, y muchísimo trabajo interpretarla.</div></div>
    <div class="box"><h4>Tocando</h4>
      <div style="font-size:.95rem;line-height:1.7">
      <b>Bumper:</b> un pulsador en el paragolpes. Barato y no falla, pero te avisa cuando ya chocaste.<br><br>
      <b>Encoder:</b> mide cuánto giró el eje. Sirve para la odometría y para darte cuenta de que la
      rueda no gira aunque le estés dando corriente.<br><br>
      <b>Sensor de corriente:</b> si el motor consume de más, algo está trabado.</div></div>
  </div>
  <div class="hint">Un robot bien hecho tiene <b>los dos tipos</b>. El que mide de lejos para no chocar,
  y el que confirma el golpe cuando el otro falló.</div>`},

{k:'Arquitectura',t:'El bucle de control',h:`
  <div class="flow">
    <div class="fnode i"><div class="fh">SENTIR</div><div class="fs">leer todos los sensores</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">PENSAR</div><div class="fs">decidir qué hacer con eso</div></div>
    <div class="farr">→</div>
    <div class="fnode o"><div class="fh">ACTUAR</div><div class="fs">mandar las órdenes a los motores</div></div>
  </div>
  <div class="big">Ese ciclo se repite muchas veces por segundo, para siempre. La velocidad a la que
  gira se llama <b>frecuencia de control</b>, y es una decisión de diseño importante.<br><br>
  El tiempo que pasa entre que algo ocurre y el robot reacciona se llama <b>latencia</b>. Si el bucle
  gira una vez por segundo y el robot va a medio metro por segundo, entre medición y medición recorre
  medio metro a ciegas. Podés tener el mejor sensor del mundo: igual choca.</div>
  <div class="hint">Cuando un robot reacciona tarde, casi nunca es culpa del sensor.
  Es que el bucle gira demasiado lento o el robot va demasiado rápido para ese bucle.</div>`},

{k:'Programación',t:'Máquinas de estado',h:`
  <div class="big">Un robot no hace una sola cosa: hace distintas cosas según la situación. La manera
  estándar de organizar eso es una <b>máquina de estados</b>.</div>
  <div class="serie">BUSCANDO    gira en el lugar
              si ve la línea      →  pasa a SIGUIENDO

  SIGUIENDO   avanza derecho
              si pierde la línea  →  vuelve a BUSCANDO
              si detecta obstáculo →  pasa a ESQUIVANDO

  ESQUIVANDO  retrocede y dobla
              si el camino está libre →  vuelve a BUSCANDO</div>
  <div class="big">En cada momento el robot está en <b>un solo estado</b> y hace lo que corresponde a
  ese estado. Las condiciones son las que lo hacen saltar de uno a otro.<br><br>
  La ventaja es que podés razonar sobre cada situación por separado, en vez de tener un montón de
  condiciones enredadas todas juntas.</div>`},

{k:'Control',t:'Del todo o nada al ajuste fino',h:`
  <div class="big">Un seguidor de línea con control <b>todo o nada</b> hace esto: si me desvié a la
  izquierda, giro a la derecha a fondo. Funciona, pero anda en zigzag, brusco y lento.</div>
  <div class="big" style="margin-top:14px">El <b>control proporcional</b> mira <b>cuánto</b> te
  desviaste, no solo hacia qué lado:</div>
  <div class="serie">error = dónde debería estar  -  dónde estoy

  corrección = error * ganancia

  desviado apenas    →  corrige apenas
  desviado mucho     →  corrige fuerte</div>
  <div class="big">El resultado es un movimiento suave, en vez de un zigzag.<br><br>
  El número que multiplica se llama <b>ganancia</b>, y ajustarlo es buena parte del trabajo.
  Si es muy chica el robot corrige tarde y se sale. Si es muy grande se pasa de largo, corrige para el
  otro lado, se vuelve a pasar, y termina oscilando.</div>
  <div class="hint">Esto es un pariente cercano de la histéresis: en los dos casos el problema es que
  una decisión binaria no alcanza para manejar algo que varía de manera continua.</div>`},

{k:'Fallas',t:'Cuando el robot se rompe o rompe algo',h:`
  <div class="glos">
    <div><b>Se traba.</b> Las ruedas giran, el robot no avanza. Se detecta comparando la orden con lo
    que dicen los sensores: si mandé avanzar y la distancia a la pared no cambia, algo pasa.</div>
    <div><b>Se cuelga el programa.</b> Para eso está el <b>watchdog</b>: un temporizador al que el
    programa le tiene que avisar que sigue vivo. Si deja de avisar, reinicia todo.</div>
    <div><b>Se queda sin batería a mitad de camino.</b> Un robot serio mide su propia batería y vuelve
    a cargar antes de quedarse.</div>
    <div><b>Lastima a alguien.</b> La <b>parada de emergencia</b> tiene que cortar la corriente
    <b>por hardware</b>. Si depende del programa y el programa se colgó, no sirve para nada.</div>
  </div>
  <div class="hint">Y al encender, siempre lo mismo: <b>motores parados</b> hasta comprobar que los
  sensores contestan. El robot recién prendido no sabe nada del mundo ni de lo que pasó antes.</div>`},

{k:'IA',t:'Robots que aprenden',h:`
  <div class="big">Un sensor de distancia te dice que hay algo a 40 centímetros. No te dice si es una
  caja, un perro o una persona. Para eso hace falta <b>visión</b> y un modelo entrenado.</div>
  <div class="big" style="margin-top:14px">Eso abre posibilidades reales: robots que separan fruta
  madura de verde, que detectan una planta enferma, que distinguen una maleza de un cultivo y aplican
  herbicida solo ahí.<br><br>
  Pero cambia un problema por otro. Un sensor de distancia falla de manera <b>previsible</b>: le cuesta
  una superficie blanda. Un modelo entrenado falla de manera <b>rara</b>: anda perfecto durante meses y
  un día, con otra luz o con algo que nunca vio, se equivoca con total seguridad.</div>
  <div class="hint">Por eso en las aplicaciones donde una equivocación es grave, el modelo casi nunca
  decide solo: propone, y hay un límite duro programado a mano que puede frenarlo.</div>`},

{k:'Glosario',t:'Vocabulario de robótica',h:`
  <div class="glos">
    <div><b>Grado de libertad</b> — cada movimiento independiente que el robot puede hacer.</div>
    <div><b>Efector final</b> — la parte del extremo que hace el trabajo: pinza, ventosa, herramienta.</div>
    <div><b>Driver</b> — el circuito que maneja la corriente grande del motor.</div>
    <div><b>Puente H</b> — el driver que permite invertir el sentido de giro.</div>
    <div><b>Reductora</b> — engranajes que bajan las vueltas y suben la fuerza.</div>
    <div><b>Encoder</b> — mide cuánto giró un eje.</div>
    <div><b>Odometría</b> — estimar la posición contando el giro de las ruedas.</div>
    <div><b>Tracción diferencial</b> — doblar variando la velocidad de cada lado, sin volante.</div>
    <div><b>Máquina de estados</b> — organizar el programa en situaciones y transiciones.</div>
    <div><b>Ganancia</b> — cuánto corrige el control por cada unidad de error.</div>
    <div><b>Latencia</b> — el tiempo entre que algo pasa y el robot reacciona.</div>
    <div><b>Watchdog</b> — temporizador que reinicia el sistema si el programa se cuelga.</div>
    <div><b>Payload</b> — el peso máximo que el robot puede manipular.</div>
    <div><b>Masa común</b> — unir los GND de dos fuentes para que compartan referencia.</div>
  </div>`},

{k:'Cierre',t:'Lo que se lleva un robot puesto',h:`
  <div class="big">Un robot es un aparato con sensores y decisiones, como los que veníamos viendo,
  más un cuerpo que se mueve. Y ese cuerpo trae toda una capa nueva de problemas:
  energía, fuerza, ubicación, tiempo de reacción y seguridad.<br><br>
  Casi todo lo difícil de la robótica no está en decidir qué hacer. Está en que el mundo real es
  impredecible: las ruedas patinan, la batería se descarga, la luz cambia y las cosas se mueven de lugar.</div>
  <div class="hint">Los dos bancos que siguen son para practicar esto. El primero va de cuerpo, motores
  y movimiento. El segundo, de control, programación y situaciones para resolver.</div>`}
];

const NAVR=['Lo que cambia con el cuerpo','Grados de libertad','Familias de robots','Motores',
 'Drivers y puente H','Alimentación','Tracción diferencial','Odometría','Percepción','El bucle de control',
 'Máquinas de estado','Control proporcional','Fallas y seguridad','Robots que aprenden','Vocabulario','Cierre'];

let CURR=-1;
function navRHTML(cur){
  const items=RST.map((s,i)=>'<div class="iso '+(i===cur?'cur':'')+'" onclick="rGo('+i+')">'+
    '<span class="isn">'+(i+1)+'</span><span>'+NAVR[i]+'</span></div>').join('');
  return '<aside class="iside"><div class="sh">Robótica: cuerpos que se mueven</div>'+items+
    '<div class="isidefoot"><a onclick="robHome()">← Volver al módulo</a>'+
    '<a onclick="portal()">Ir al panel general</a></div></aside>';
}
function rGo(i){
  fichaBtn.style.display="none"; roboMode(true); CURI=-1; CUR4=-1;
  if(i<0)i=0; if(i>=RST.length) return robHome();
  CURR=i;
  const s=RST[i];
  setHead("Robótica: cuerpos que se mueven",(i+1)+" de "+RST.length);
  app.innerHTML='<div class="ilay">'+navRHTML(i)+'<div><div class="icard">'+
    '<div class="topbar"><i style="width:'+((i+1)/RST.length*100)+'%"></i></div>'+
    '<div class="kicker">'+s.k+'</div><h2 class="ih">'+s.t+'</h2>'+s.h+
    '<div class="navb">'+(i>0?'<button class="btn ghost" onclick="rGo('+(i-1)+')">← Anterior</button>':'')+
    '<button class="btn" onclick="rGo('+(i+1)+')">'+(i+1>=RST.length?'Terminar':'Siguiente →')+'</button></div>'+
    '<div class="kbhint">Podés avanzar con las flechas del teclado</div>'+
    '</div></div></div>';
  window.scrollTo(0,0);
}
if(typeof document.addEventListener==="function")document.addEventListener("keydown",function(e){
  if(CURR<0)return;
  const t=(e.target&&e.target.tagName)||"";
  if(t==="INPUT"||t==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();rGo(CURR+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();rGo(CURR-1)}
});
function robHome(){
  fichaBtn.style.display="none"; roboMode(true); CURR=-1; CURI=-1; CUR4=-1;
  setHead("Robótica: cuerpos que se mueven","motores, movimiento y control");
  app.innerHTML='<div class="rowrap">'+
    '<div class="trackcard" onclick="rGo(0)" style="margin-bottom:14px">'+
      '<div class="tg">Empezá por acá</div><h3>Presentación · 16 pantallas</h3>'+
      '<p>Grados de libertad, familias de robots, qué motor para cada cosa, drivers y puente H, el '+
      'problema de la alimentación, tracción diferencial, odometría, percepción, el bucle de control, '+
      'máquinas de estado, control proporcional, fallas y seguridad, y robots que aprenden.</p></div>'+
    '<div class="trackcard" onclick="quizStart(EJ_ROBA,\'Cuerpo, motores y movimiento\',\'robHome()\')" style="margin-bottom:14px">'+
      '<div class="tg">Banco A · '+EJ_ROBA.length+' ejercicios</div><h3>Cuerpo, motores y movimiento</h3>'+
      '<p>Elegir el motor adecuado, por qué hace falta un driver, el puente H, el robot que se reinicia '+
      'solo, masa común, cómo dobla y cómo gira en el lugar, odometría, encoders y sensores.</p></div>'+
    '<div class="trackcard" onclick="quizStart(EJ_ROBB,\'Control, programación y situaciones\',\'robHome()\')" style="margin-bottom:14px">'+
      '<div class="tg">Banco B · '+EJ_ROBB.length+' ejercicios</div><h3>Control, programación y situaciones</h3>'+
      '<p>Leer máquinas de estado y código de robots, control proporcional y ganancia, latencia, '+
      'watchdog, parada de emergencia, detección de atascos y casos para diseñar.</p></div>'+
    '<button class="btn ghost" onclick="portal()">← Volver al panel</button></div>';
  window.scrollTo(0,0);
}

portal();
</script>
