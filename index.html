<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor de Consultas · VLA en datos</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--txt:#e2e8f0;--muted:#94a3b8;
    --accent:#38bdf8;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--b1:#a78bfa;--b2:#f472b6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e1b4b);color:var(--txt);min-height:100vh}
  header{padding:16px;text-align:center;position:relative}
  header h1{margin:0;font-size:1.4rem;background:linear-gradient(90deg,var(--accent),var(--b1),var(--b2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:3px 0 0;color:var(--muted);font-size:.85rem}
  .fichaBtn{position:absolute;right:12px;top:14px;background:var(--card2);color:var(--txt);border:1px solid #3a4a63;
    border-radius:99px;padding:7px 13px;font-size:.82rem;cursor:pointer}
  .wrap{max-width:700px;margin:0 auto;padding:8px 16px 50px}
  .card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.3);margin-bottom:16px}
  h2{margin:.2em 0 .5em;font-size:1.2rem}h3{font-size:1rem}
  .muted{color:var(--muted)}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px;font-weight:600}
  input[type=text],select{width:100%;background:#0b1220;color:var(--txt);border:1px solid #334155;border-radius:10px;
    padding:11px;font-size:1rem;font-family:inherit}
  .step-label{font-size:.8rem;color:var(--warn);margin:6px 0 8px;font-weight:700;letter-spacing:.3px}
  .opts{display:grid;gap:10px}
  button.opt{background:var(--card2);color:var(--txt);border:2px solid transparent;border-radius:12px;padding:13px;
    font-size:1rem;text-align:left;cursor:pointer;transition:.15s;font-family:inherit}
  button.opt:hover{border-color:var(--accent)}button.opt.sel{border-color:var(--accent);background:rgba(56,189,248,.13)}
  button.opt .vt{font-size:.74rem;color:var(--muted);display:block;margin-top:3px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .row > *{flex:1;min-width:110px}
  .btn{background:linear-gradient(90deg,var(--accent),var(--b1));color:#0f172a;font-weight:700;border:none;
    border-radius:12px;padding:14px;font-size:1.02rem;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid #3a4a63}
  .btn.sm{padding:10px;font-size:.9rem;width:auto}
  .uploadbox{border:2px dashed #3a4a63;border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:.15s}
  .uploadbox:hover{border-color:var(--accent);background:rgba(56,189,248,.05)}
  .recipe{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;
    font-size:.86rem;color:var(--accent);margin:12px 0;line-height:1.6;word-break:break-word}
  .result{background:#0b1220;border-radius:10px;padding:14px;margin-top:10px;overflow:hidden}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border-radius:8px}
  .scrollx table{min-width:max-content}
  .scrollx th,.scrollx td{white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #1e293b}th{color:var(--muted)}
  .bars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .barrow{display:flex;align-items:center;gap:8px;font-size:.82rem}
  .barrow .lab{width:34%;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .bo{flex:1;background:#1e293b;border-radius:6px;overflow:hidden}
  .barrow .bi{height:18px;background:linear-gradient(90deg,var(--accent),var(--b1));border-radius:6px}
  .barrow .vv{width:60px;font-weight:700;color:var(--accent);text-align:right}
  .pill{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 10px;font-size:.76rem;margin:2px}
  .hint{background:rgba(251,191,36,.1);border-left:3px solid var(--warn);padding:10px;border-radius:8px;font-size:.85rem;margin-top:8px}
  .fentry{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px}
  .fentry .q{font-weight:700}.fentry .r{font-size:.82rem;color:var(--accent);font-family:ui-monospace,monospace;margin:6px 0}
  .crumbs{font-size:.78rem;color:var(--muted);margin-bottom:8px}
  .typerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}.typerow .cn{flex:1;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(56,189,248,.13);border:1px solid var(--accent);
    border-radius:99px;padding:5px 11px;font-size:.82rem;font-family:ui-monospace,monospace}
  .chip a{color:var(--bad);cursor:pointer;font-weight:700;text-decoration:none}
  .addbox{background:var(--card2);border-radius:12px;padding:12px;margin:10px 0}
  .addbox b{font-size:.85rem}
  details.pyc,details.hl{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:8px 12px;margin:10px 0}
  details.pyc summary,details.hl summary{cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:600}
  details.pyc pre{margin:8px 0 2px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--good);
    white-space:pre-wrap;word-break:break-word;line-height:1.5}
  table.hlt tr.hit{background:rgba(52,211,153,.16)}table.hlt tr.hit td{color:var(--good)}
  table.hlt tr.miss td{color:#475569}
  .run-dots{display:inline-block;color:var(--accent);font-weight:600}
  .run-dots::after{content:"";animation:dots 1s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .banner{background:linear-gradient(90deg,rgba(56,189,248,.15),rgba(167,139,250,.15));border:1px solid #3a4a63;
    border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .banner .qq{font-weight:700;font-size:1.02rem;margin-top:4px}
  .chal{background:var(--card2);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
  .chal:hover{border-color:var(--accent)}.chal .ct{font-weight:700}.chal .cd{font-size:.8rem;color:var(--muted);margin-top:3px}
  .verdict{border-radius:12px;padding:14px;margin-top:10px;font-weight:600}
  .verdict.ok{background:rgba(52,211,153,.15);border:1px solid var(--good);color:var(--good)}
  .verdict.no{background:rgba(248,113,113,.13);border:1px solid var(--bad);color:var(--bad)}
  .done{display:inline-block;color:var(--good);font-size:.8rem;margin-left:6px}
  @media print{header,.fichaBtn,.noprint{display:none!important}body{background:#fff;color:#000}
    .card{box-shadow:none;background:#fff;border:1px solid #ccc}.fentry{background:#f4f4f4}.r{color:#06c}}
</style>
</head>
<body>
<header>
  <h1>Constructor de Consultas</h1>
  <p>VLA en datos · armá tu consulta paso a paso y construí tu ficha</p>
  <button class="fichaBtn" id="fichaBtn" onclick="goFicha()" style="display:none"></button>
</header>
<div class="wrap" id="app"></div>

<script>
/* ===================== ESTADO GLOBAL ===================== */
let D=null;                 // dataset activo {nombre,file,cols:[{k,t}],data:[obj],sugs:[[texto,verbo]]}
let PROY={bigQ:"",grupo:""};
let FICHA=[];
let B={};                   // construcción actual
let bstep="q";
let PRACTICE=null;          // desafío de práctica activo {ch, idx} o null
const app=document.getElementById("app"),fichaBtn=document.getElementById("fichaBtn");
const KEY="vla_constructor_v1";

const VERBS={
 ver:["Ver las filas","mostrar la tabla que quedó tras filtrar"],
 sumar:["Contar / Sumar / Promediar","calcular un número de una columna"],
 ordenar:["Ordenar","la que más / la que menos"],
 agrupar:["Agrupar","juntar por categoría y resumir"],
 graficar:["Graficar","comparar o ver cómo cambia"]
};
const OPS={eq:"==",ne:"≠",gt:">",lt:"<",ge:"≥",le:"≤"};
const RSYM={eq:"==",ne:"!=",gt:">",lt:"<",ge:">=",le:"<="};
const uniq=c=>[...new Set(D.data.map(r=>r[c]))];
const numv=a=>a.map(Number);

/* ===================== PERSISTENCIA ===================== */
function save(){try{localStorage.setItem(KEY,JSON.stringify({D,PROY,FICHA}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.D){D=s.D;PROY=s.PROY||PROY;FICHA=s.FICHA||[];return true}}catch(e){}return false}
function reset(){localStorage.removeItem(KEY);D=null;PROY={bigQ:"",grupo:""};FICHA=[];home()}

/* ===================== PARSEO CSV ===================== */
function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim().length);
  const split=l=>{const out=[];let cur="",q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}
      else if(ch===","&&!q){out.push(cur);cur=""}else cur+=ch}
    out.push(cur);return out.map(s=>s.trim())};
  const headers=split(lines[0]);
  const rows=lines.slice(1).map(split);
  const cols=headers.map((h,i)=>{
    const vals=rows.map(r=>r[i]).filter(v=>v!=="");
    const isNum=vals.length>0&&vals.every(v=>/^-?\d+([.,]\d+)?$/.test(v.replace(/\s/g,"")));
    return {k:h,t:isNum?"num":"cat"};
  });
  const data=rows.map(r=>{const o={};headers.forEach((h,i)=>{
    let v=r[i]!==undefined?r[i]:"";
    if(cols[i].t==="num")v=parseFloat(v.replace(/\s/g,"").replace(",","."));
    o[h]=v;});return o;});
  return {cols,data};
}
function genSugs(cols){
  const n=cols.filter(c=>c.t==="num"),c=cols.filter(c=>c.t==="cat"),s=[];
  if(n.length)s.push([`¿Cuál es el/la de mayor ${n[0].k}?`,"ordenar"]);
  if(n.length)s.push([`¿Cuánto suman los ${n[0].k}?`,"sumar"]);
  if(c.length)s.push([`¿Cuántas filas hay de cada ${c[0].k}?`,"agrupar"]);
  if(c.length&&n.length)s.push([`Promedio de ${n[0].k} por cada ${c[0].k}`,"agrupar"]);
  if(n.length)s.push([`Graficar ${n[0].k}`,"graficar"]);
  return s;
}

/* ===================== HOME / CARGA ===================== */
function home(){
  fichaBtn.style.display="none";
  const hasSaved=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.D}catch(e){return false}})();
  app.innerHTML=`<div class="card">
    <h2>Empecemos</h2>
    <p class="muted">Cargá un archivo <b>CSV</b> con tus datos (de turismo, biodiversidad, lo que sea). La app detecta sola las columnas.</p>
    <div class="uploadbox" id="up"><div style="font-size:2rem"></div>
      <div style="margin-top:6px;font-weight:700">Cargar CSV</div>
      <div class="muted" style="font-size:.82rem">Tocá acá y elegí tu archivo .csv</div>
      <input type="file" id="file" accept=".csv,text/csv" style="display:none"></div>
    <button class="btn" onclick="practiceHome()">Practiquemos un rato!</button>
    <button class="btn" onclick="cicloHome()">El ciclo de datos (decidí y pensá)</button>
    <button class="btn" onclick="flowHome()">Misión: diagramas de flujo</button>
    <button class="btn" onclick="pyHome()">Pensar como en Python</button>
    <button class="btn ghost" onclick="loadDemo()">Probar con datos de ejemplo (libre)</button>
    ${hasSaved?`<button class="btn" onclick="if(load())setupProyecto()">▶ Continuar mi proyecto guardado</button>
      <button class="btn ghost" onclick="reset()">Borrar y empezar de cero</button>`:""}
  </div>
  <button class="btn ghost" onclick="portal()">← Volver al panel</button>`;
  const up=document.getElementById("up"),file=document.getElementById("file");
  up.onclick=()=>file.click();
  file.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=ev=>{try{const p=parseCSV(ev.target.result);
      D={nombre:f.name,file:f.name.replace(/\.csv$/i,""),cols:p.cols,data:p.data};
      confirmTypes();}catch(err){alert("No pude leer el CSV. Revisá que sea separado por comas.")}};
    rd.readAsText(f);};
}
function loadDemo(){
  const csv=`mes,visitantes,temporada,ocupacion,precio
Enero,9200,Alta verano,88,45000
Febrero,8500,Alta verano,82,43000
Marzo,6800,Media,65,35000
Mayo,1500,Baja,22,20000
Julio,7800,Alta invierno,90,48000
Septiembre,2200,Media,32,26000
Noviembre,5200,Alta,60,33000`;
  const p=parseCSV(csv);D={nombre:"ejemplo-turismo.csv",file:"ejemplo-turismo",cols:p.cols,data:p.data};confirmTypes();
}

/* ===================== CONFIRMAR TIPOS ===================== */
function confirmTypes(){
  fichaBtn.style.display="none";
  app.innerHTML=`<div class="card">
    <div class="crumbs">${D.nombre} · ${D.data.length} filas</div>
    <h2>¿Está bien el tipo de cada columna?</h2>
    <p class="muted">Texto = categoría (C) · Número = cuantitativa (Q).</p>
    <div class="hint">Ojo: a veces una columna de <b>números no es cuantitativa</b> (un código, un ID, a veces el año). Si no tiene sentido promediarla, ponela como <b>texto</b>.</div>
    <div style="margin-top:14px">${D.cols.map((c,i)=>`<div class="typerow">
      <span class="cn">${c.k}</span>
      <select onchange="D.cols[${i}].t=this.value">
        <option value="cat" ${c.t==="cat"?"selected":""}>texto (categoría)</option>
        <option value="num" ${c.t==="num"?"selected":""}>número (cuantitativa)</option></select>
    </div>`).join("")}</div>
    <button class="btn" onclick="afterTypes()">Confirmar →</button>
    <button class="btn ghost" onclick="home()">← Cargar otro</button>
  </div>`;
}
function afterTypes(){
  // re-castear data según tipos confirmados
  D.data=D.data.map(r=>{const o={...r};D.cols.forEach(c=>{o[c.k]=c.t==="num"?parseFloat(String(r[c.k]).replace(/\s/g,"").replace(",","."))||0:String(r[c.k]);});return o;});
  D.sugs=genSugs(D.cols);save();setupProyecto();
}

/* ===================== SETUP PROYECTO ===================== */
function setupProyecto(){
  fichaBtn.style.display=FICHA.length?"block":"none";fichaBtn.textContent=`Mi ficha (${FICHA.length})`;
  app.innerHTML=`<div class="card">
    <div class="crumbs">${D.nombre}</div>
    <h2>La pregunta grande de tu proyecto</h2>
    <p class="muted">¿Qué quieren averiguar? La respondés con varias consultas.</p>
    <label>Pregunta del proyecto</label>
    <input type="text" id="bigQ" placeholder="Ej: ¿Cómo cambia el turismo de VLA según la época?" value="${PROY.bigQ}">
    <label>Grupo / integrantes</label>
    <input type="text" id="grupo" placeholder="Nombres" value="${PROY.grupo}">
    <button class="btn" onclick="startBuild()">Empezar a construir consultas →</button>
    ${FICHA.length?`<button class="btn ghost" onclick="goFicha()">Ver mi ficha (${FICHA.length})</button>`:""}
    <div style="margin-top:12px"><span class="muted" style="font-size:.8rem">Columnas:</span><br>
      ${D.cols.map(c=>`<span class="pill">${c.k} <small>(${c.t==="num"?"número":"texto"})</small></span>`).join("")}</div>
  </div>`;
}
function startBuild(){PROY.bigQ=val("bigQ");PROY.grupo=val("grupo");save();B={q:"",filters:[],verb:null};bstep="q";renderBuild();}
const val=id=>{const e=document.getElementById(id);return e?e.value:""};

/* ===================== WIZARD ===================== */
const REAL_FILES={
  biodiversidad:"Datos reales · iNaturalist / ArgentiNat (recorte del Parque Nahuel Huapi)",
  invasoras:"Datos reales · iNaturalist / ArgentiNat (Isla Victoria)"};
function dataOrigen(D){return REAL_FILES[D.file]
  ? `<span class="pill" style="background:rgba(52,211,153,.13);color:var(--good);font-size:.72rem">${REAL_FILES[D.file]}</span>`
  : `<span class="pill" style="background:rgba(251,191,36,.12);color:var(--warn);font-size:.72rem">Datos de ejemplo (inventados para practicar, no son reales)</span>`;}
function dataPeek(D){
  const heads=D.cols.map(c=>c.k);
  return `<details class="hl" style="margin-top:8px"><summary>Ver la tabla de datos (${D.data.length} filas)</summary>
    <div class="scrollx"><table><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr>
    ${D.data.map(r=>`<tr>${heads.map(h=>`<td>${fmt(r[h])}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
}
function buildShell(inner){
  if(PRACTICE){fichaBtn.style.display="none";}
  else{fichaBtn.style.display="block";fichaBtn.textContent=`Mi ficha (${FICHA.length})`;}
  const allSteps=["q","filters","op","run","interpret"],labels={q:"Pregunta",filters:"Filtros",op:"Operación",run:"Ejecutar",interpret:"Interpretar"};
  const steps=PRACTICE?allSteps.filter(s=>s!=="q"&&s!=="interpret"):allSteps;
  const banner=PRACTICE?`<div class="banner">Ejercicio ${PRACTICE.idx+1}/${CHALLENGES.length} · <span class="muted">${CHALLENGES[PRACTICE.idx].title}</span>
    <div class="qq">${B.q}</div>
    <div class="muted" style="font-size:.78rem;margin-top:6px">Columnas: ${D.cols.map(c=>`<b>${c.k}</b> (${c.t==="num"?"número":"texto"})`).join(" · ")}</div>
    <div style="margin-top:6px">${dataOrigen(D)}</div>
    ${dataPeek(D)}</div>`:"";
  app.innerHTML=`<div class="card">
    <div class="crumbs">${D.nombre}${PRACTICE?"":` · Consulta #${FICHA.length+1}`}</div>
    ${banner}
    <div class="row noprint" style="gap:4px">${steps.map(s=>`<span class="pill" style="${s===bstep?'background:var(--accent);color:#0f172a':''}">${labels[s]}</span>`).join("")}</div>
    ${inner}</div>`;
}
function renderBuild(){({q:stepQ,filters:stepFilters,op:stepOp,run:stepRun,interpret:stepInterpret}[bstep])();}

function colSample(c){
  if(c.t==="num"){const ns=D.data.map(r=>parseFloat(r[c.k])).filter(v=>!isNaN(v));
    if(!ns.length)return"";return `de ${Math.min(...ns)} a ${Math.max(...ns)}`;}
  const vs=uniq(c.k).slice(0,3);return vs.join(", ")+(uniq(c.k).length>3?"…":"");
}
function colsPanel(){return `<div class="hint" style="text-align:left">
    <b>Tus datos tienen estas columnas.</b> Miralas para que se te ocurra qué preguntar:
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
    ${D.cols.map(c=>`<div><span class="pill">${c.k} <small>(${c.t==="num"?"número":"texto"})</small></span>
      <small class="muted">ej: ${colSample(c)}</small></div>`).join("")}</div></div>`;}
function stepQ(){
  buildShell(`<div class="step-label">PASO 1 · ¿Qué querés averiguar con esta consulta?</div>
    ${colsPanel()}
    <p class="muted">Elegí una idea o escribí la tuya.</p>
    <div class="opts">${D.sugs.map((s,i)=>`<button class="opt" onclick="setQ(${i})">${s[0]}</button>`).join("")}</div>
    <label>…o escribí tu propia pregunta</label><input type="text" id="ownQ" placeholder="Tu pregunta">
    <button class="btn" onclick="setQ(-1)">Seguir →</button>
    <button class="btn ghost" onclick="setupProyecto()">← Volver</button>`);
}
function setQ(i){
  if(i>=0){B.q=D.sugs[i][0];B.hintVerb=D.sugs[i][1];}
  else{const v=val("ownQ").trim();if(!v){alert("Escribí tu pregunta o elegí una.");return}B.q=v;B.hintVerb=null;}
  if(!B.filters)B.filters=[];
  bstep="filters";renderBuild();
}
const chipFilter=f=>`${f.col} ${OPS[f.op]} ${f.t==="num"?f.val:'"'+f.val+'"'}`;
function stepFilters(){
  buildShell(`<div class="step-label">PASO 2 · ¿Con qué filas te quedás? (filtros)</div>
    <p class="muted">Pregunta: <b>${B.q}</b></p>
    <p class="muted">Un filtro achica la tabla. Podés encadenar <b>varios</b> (se cumplen TODOS) o no poner ninguno.</p>
    ${B.filters.length
      ? `<div class="chips">${B.filters.map((f,i)=>`<span class="chip">${chipFilter(f)} <a onclick="rmFilter(${i})" title="quitar">✕</a></span>`).join('<span class="muted" style="align-self:center">Y</span>')}</div>`
      : `<div class="hint">Sin filtros todavía: trabajarías con toda la tabla (${D.data.length} filas).</div>`}
    <div class="addbox"><b>Agregar un filtro</b>
      <p class="muted" style="font-size:.8rem;margin:4px 0 8px">columna · operador · valor</p>
      ${filterFormHTML()}
      <button class="btn ghost sm" onclick="addFilter()">+ Agregar este filtro</button></div>
    <button class="btn" onclick="bstep='op';renderBuild()">Siguiente: ¿qué hago con esas filas? →</button>
    <button class="btn ghost" onclick="${PRACTICE?'practiceHome()':"bstep='q';renderBuild()"}">← ${PRACTICE?'Volver a los ejercicios':'Volver a la pregunta'}</button>`);
  wireFilter();
}
function addFilter(){const f=readFilter();

  return rows.filter(r=>{const c=r[f.col];return {eq:c==v,ne:c!=v,gt:c>v,lt:c<v,ge:c>=v,le:c<=v}[f.op];});}

/* ===================== EJECUTAR ===================== */
const pyCond=f=>`(df["${f.col}"] ${RSYM[f.op]} ${f.t==="num"?f.val:'"'+f.val+'"'})`;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function compute(){
  let rows=D.data.slice();
  const recipe=[`read_csv(${D.file})`],py=["import pandas as pd",`df = pd.read_csv("${D.file}.csv")`];
  B.filters.forEach(f=>{rows=applyFilter(rows,f);recipe.push(recipeFilter(f));});
  py.push(B.filters.length?`d = df[${B.filters.map(pyCond).join(" & ")}]`:`d = df`);
  let headers=D.cols.map(c=>c.k),outRows=null,chart=null,summary="",answer=null,pyLast="resultado = d";
  try{
  const v=B.verb;
  if(v==="ver"){outRows=rows;summary=`${rows.length} filas quedaron tras los filtros.`;answer={kind:"rows",v:rows.length};pyLast="resultado = d";}
  else if(v==="sumar"){const agg=val("agg");
    if(agg==="contar"){recipe.push("contar_filas()");summary=`Resultado: ${rows.length} filas.`;outRows=[["cantidad",rows.length]];headers=null;answer={kind:"num",v:rows.length};pyLast="resultado = len(d)";}
    else{const col=val("acol"),vals=numv(rows.map(r=>r[col]));
      if(agg==="suma"){const s=vals.reduce((a,b)=>a+b,0);recipe.push(`suma( ${col} )`);summary=`Total de ${col}: ${fmt(s)}.`;outRows=[["suma("+col+")",s]];answer={kind:"num",v:s};pyLast=`resultado = d["${col}"].sum()`;}
      else{const m=vals.reduce((a,b)=>a+b,0)/(vals.length||1),mr=Math.round(m*10)/10;recipe.push(`promedio( ${col} )`);summary=`Promedio de ${col}: ${fmt(mr)}.`;outRows=[["promedio("+col+")",mr]];answer={kind:"num",v:mr};pyLast=`resultado = d["${col}"].mean()`;}
      headers=null;}}
  else if(v==="ordenar"){const col=val("ocol"),dir=val("odir"),top=+val("otop");
    rows=rows.slice().sort((a,b)=>dir==="desc"?b[col]-a[col]:a[col]-b[col]).slice(0,top);
    recipe.push(`ordenar_por( ${col}, ${dir==="asc"?"asc":"desc"} )`,`primeras( ${top} )`);outRows=rows;
    summary=`1°: ${rows[0][D.cols[0].k]} (${col} = ${fmt(rows[0][col])}).`;answer={kind:"cat",v:String(rows[0][D.cols[0].k])};
    pyLast=`resultado = d.sort_values("${col}", ascending=${dir==="asc"?"True":"False"}).head(${top})`;}
  else if(v==="agrupar"){const by=val("gcol"),agg=val("gagg"),g={};
    rows.forEach(r=>{(g[r[by]]=g[r[by]]||[]).push(r)});recipe.push(`agrupar_por( ${by} )`);let pairs;
    if(agg==="suma"){const vc=val("gvcol");recipe.push(`suma( ${vc} )`);pairs=Object.entries(g).map(([k,v])=>[k,numv(v.map(r=>r[vc])).reduce((a,b)=>a+b,0)]);headers=[by,"suma("+vc+")"];pyLast=`resultado = d.groupby("${by}")["${vc}"].sum().sort_values(ascending=False)`;}
    else{recipe.push("contar_filas()");pairs=Object.entries(g).map(([k,v])=>[k,v.length]);headers=[by,"cantidad"];pyLast=`resultado = d.groupby("${by}").size().sort_values(ascending=False)`;}
    pairs.sort((a,b)=>b[1]-a[1]);outRows=pairs;chart=pairs;summary=`${pairs[0][0]} es la categoría más alta (${fmt(pairs[0][1])}).`;answer={kind:"cat",v:String(pairs[0][0])};}
  else if(v==="graficar"){const tipo=val("gt"),x=val("gx"),y=val("gy");let pairs=rows.map(r=>[r[x],r[y]]);
    if(tipo==="barras"){pairs.sort((a,b)=>b[1]-a[1]);pairs=pairs.slice(0,12);}else pairs=pairs.slice(0,18);
    recipe.push(`graficar_${tipo}( X=${x}, Y=${y} )`);chart=pairs;headers=null;summary=`Gráfico de ${y} por ${x}.`;answer={kind:"chart"};
    py.unshift("import plotly.express as px");pyLast=`resultado = px.${tipo==="barras"?"bar":"line"}(d, x="${x}", y="${y}")`;}
  }catch(e){summary="Faltó completar alguna pieza. Volvé y revisá.";}
  py.push(pyLast,"print(resultado)");
  B.recipe="print( "+recipe.join(" → ")+" )";B.pycode=py.join("\n");B.summary=summary;B.answer=answer;
  return {headers,outRows,chart,summary,filters:B.filters.length?B.filters.slice():null};
}
const fmt=n=>(typeof n==="number"?n.toLocaleString("es-AR"):n);
function barsHTML(p){const max=Math.max(...p.map(x=>+x[1]))||1;
  return `<div class="bars">${p.map(x=>`<div class="barrow"><span class="lab">${x[0]}</span><span class="bo"><span class="bi" style="width:${Math.max(4,(+x[1]/max)*100)}%"></span></span><span class="vv">${fmt(+x[1])}</span></div>`).join("")}</div>`;}
function tableHTML(headers,rows){
  if(!headers)return `<table>${rows.map(r=>`<tr><th>${r[0]}</th><td style="font-weight:700;color:var(--accent)">${fmt(r[1])}</td></tr>`).join("")}</table>`;
  const show=rows.slice(0,12);
  return `<table><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>${show.map(r=>`<tr>${(Array.isArray(r)?r:D.cols.map(c=>r[c.k])).map(c=>`<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</table>${rows.length>12?`<p class="muted" style="margin:6px 0 0">…y ${rows.length-12} filas más.</p>`:""}`;
}
function stepRun(){const res=compute();B._res=res;
  buildShell(`<div class="step-label">PASO 4 · Ejecutando…</div>
    <p class="muted">La consulta que armaste:</p>
    <div class="recipe">${B.recipe}</div>
    <div class="result"><span class="run-dots">Ejecutando sobre ${D.data.length} filas</span></div>`);
  setTimeout(()=>{if(bstep==="run")showResult(res);},700);
}
function showResult(res){
  const body=res.chart?barsHTML(res.chart):`<div class="scrollx">${tableHTML(res.headers,res.outRows)}</div>`;
  const next=PRACTICE
    ? `<button class="btn" onclick="checkAnswer()">Comprobar mi respuesta</button>`
    : `<button class="btn" onclick="bstep='interpret';renderBuild()">Interpretar y guardar →</button>`;
  buildShell(`<div class="step-label">PASO 4 · Tu consulta y su resultado</div>
    <p class="muted">La receta que armaste (misma lógica que en Pandalyze):</p>
    <div class="recipe">${B.recipe}</div>
    <details class="pyc"><summary>Ver el código Python real (Pandas)</summary><pre>${esc(B.pycode)}</pre></details>
    <div class="result"><b>Resultado:</b> ${res.summary}${body}</div>
    ${res.filters?highlightBlock(res.filters):""}
    ${next}
    <button class="btn ghost" onclick="bstep='op';renderBuild()">← Ajustar la consulta</button>`);
}
function highlightBlock(filters){
  const rows=D.data.slice(0,18),heads=D.cols.map(c=>c.k);
  const pass=r=>filters.every(f=>applyFilter([r],f).length>0);
  const nHit=D.data.filter(pass).length;
  return `<details class="hl"><summary>Ver qué filas eligieron los filtros (${nHit} de ${D.data.length})</summary>
    <div class="muted" style="font-size:.78rem;margin:6px 0">Verde = pasa todos los filtros. Muestro las primeras 18 filas.</div>
    <div class="scrollx"><table class="hlt"><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr>
    ${rows.map(r=>`<tr class="${pass(r)?'hit':'miss'}">${heads.map(h=>`<td>${fmt(r[h])}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
}
function stepInterpret(){
  buildShell(`<div class="step-label">PASO 5 · ¿Qué significa? (esto va a tu ficha)</div>
    <div class="recipe">${B.recipe}</div><p class="muted" style="font-size:.82rem">${B.summary}</p>
    <label>Lo que ENCONTRÉ (lo que dicen los datos)</label><input type="text" id="enc" placeholder="Ej: Enero es el mes con más visitantes">

    <button class="btn ghost" onclick="bstep='run';renderBuild()">← Volver</button>`);
}

  app.innerHTML=`<div class="card">

    <p class="muted">Ejercicios con datos de mentira para entrenar a <b>pensar la consulta</b>. Leé la pregunta, armala paso a paso (filtros → operación) y la app te corrige.</p>
    ${n?`<div class="hint">Llevás ${n}/${CHALLENGES.length} resueltos. </div>`:""}
    ${CHALLENGES.map((ch,i)=>`<div class="chal" onclick="startChallenge(${i})">
      <div class="ct">${done[i]?"":`${i+1}. `}${ch.question}${done[i]?'<span class="done">resuelto</span>':''}</div>
      <div class="cd">${ch.title} — ${ch.cols.map(c=>c.k).join(", ")}</div></div>`).join("")}

function startChallenge(i){
  const ch=CHALLENGES[i];
  D={nombre:ch.title,file:ch.file,cols:ch.cols.map(c=>({...c})),data:ch.data.map(r=>({...r})),sugs:[]};
  PRACTICE={idx:i};B={q:ch.question,filters:[],verb:null,hintVerb:null};bstep="filters";renderBuild();
}
function checkAnswer(){
  const ch=CHALLENGES[PRACTICE.idx],a=B.answer,numK=["num","rows"];let ok=false;
  if(a){
    if(numK.includes(ch.expect.kind)&&numK.includes(a.kind)){const e=ch.expect.v;ok=Math.abs(a.v-e)<Math.max(0.5,Math.abs(e)*0.01);}
    else if(ch.expect.kind==="cat"&&a.kind==="cat"){ok=String(a.v).trim().toLowerCase()===String(ch.expect.v).trim().toLowerCase();}
  }
  showVerdict(ok,ch);
}
function showVerdict(ok,ch){
  if(ok)markDone(PRACTICE.idx);
  const res=B._res,body=res.chart?barsHTML(res.chart):`<div class="scrollx">${tableHTML(res.headers,res.outRows)}</div>`;
  const last=PRACTICE.idx+1>=CHALLENGES.length;
  buildShell(`<div class="step-label">Corrección</div>
    <div class="recipe">${B.recipe}</div>
    <div class="result"><b>Tu resultado:</b> ${res.summary}${body}</div>
    <div class="verdict ${ok?'ok':'no'}">${ok?'¡Correcto! Esa consulta responde la pregunta.':'Todavía no.<br><br><b>Pista:</b> '+ch.hint}</div>
    ${ok
      ? (last?`<div class="hint">¡Completaste todos los ejercicios!</div><button class="btn" onclick="practiceHome()">Volver a la lista</button>`
             :`<button class="btn" onclick="startChallenge(${PRACTICE.idx+1})">Siguiente ejercicio →</button><button class="btn ghost" onclick="practiceHome()">Volver a la lista</button>`)
      : `<button class="btn" onclick="bstep='filters';renderBuild()">Probá de nuevo</button><button class="btn ghost" onclick="practiceHome()">Salir de la práctica</button>`}`);
}

function quizAns(k){
  const it=QUIZ.items[QUIZ.i],ok=k===it.answer;if(ok)QUIZ.score++;
  [...document.querySelectorAll('#qopts .opt')].forEach((b,idx)=>{b.disabled=true;
    if(idx===it.answer)b.style.borderColor="var(--good)";
    if(idx===k&&!ok)b.style.borderColor="var(--bad)";});
  document.getElementById("qfb").innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?'¡Bien! ':'No exactamente. '}${it.why||''}</div>
    <button class="btn" onclick="quizNext()">${QUIZ.i+1>=QUIZ.items.length?'Ver resultado':'Siguiente →'}</button>`;
}

let FLOW=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function flowShape(s){const t=/^(INICIO|FIN)/.test(s);return `<span style="${t?'font-weight:700;color:var(--accent)':''}">${s}</span>`;}
function flowStart(items,title,back){FLOW={items,i:0,title,back,score:0};flowLoad();}
function flowLoad(){if(FLOW.i>=FLOW.items.length)return flowDone();const it=FLOW.items[FLOW.i];FLOW.chosen=[];FLOW.pool=shuffle([...it.steps,...(it.distract||[])]);flowRender();}
function flowRender(fb){
  const it=FLOW.items[FLOW.i];
  const chosenHTML=FLOW.chosen.length
    ?FLOW.chosen.map((s,k)=>`<div style="background:var(--card2);border:1px solid #3a4a63;border-radius:10px;padding:10px 14px;min-width:60%;text-align:center;cursor:pointer" onclick="flowRemove(${k})">${flowShape(s)}</div>`).join('<div style="color:var(--accent);font-weight:700">↓</div>')
    :'<div class="muted" style="font-size:.85rem">Tocá los bloques de abajo en orden. Tocá un bloque puesto para sacarlo.</div>';
  const poolHTML=FLOW.pool.map((s,idx)=>{const used=FLOW.chosen.includes(s);return `<button class="opt" ${used?'disabled style="opacity:.35"':''} onclick="flowPick(${idx})">${s}</button>`;}).join("");
  app.innerHTML=`<div class="card">
    <div class="crumbs">${FLOW.title} · ${FLOW.i+1}/${FLOW.items.length}</div>
    <div class="banner"><div class="muted" style="font-size:.8rem">Consulta a resolver:</div><div class="qq">${it.q}</div></div>
    <div class="step-label">TU DIAGRAMA DE FLUJO</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin:6px 0 12px">${chosenHTML}</div>
    <div class="step-label">BLOQUES (tocá en orden)</div>
    <div class="opts">${poolHTML}</div>
    <div id="flowfb">${fb||""}</div>

/* =========================================================================
   MOTOR: intérprete de un subconjunto de Python
   Soporta: comentarios, variables, cuentas, comparaciones, and/or/not (y/o/no),
   if / elif / else, while, for i in range(n), y las funciones de la placa.
   ========================================================================= */

function tk(line,ln){
  const T=[];let i=0;
  const isD=c=>c>="0"&&c<="9", isA=c=>/[A-Za-z_]/.test(c), isAN=c=>/[A-Za-z0-9_]/.test(c);
  while(i<line.length){
    const c=line[i];
    if(c===" "||c==="\t"){i++;continue}
    if(c==="#")break;
    if(isD(c)||(c==="."&&isD(line[i+1]))){let j=i;while(j<line.length&&/[0-9.]/.test(line[j]))j++;
      T.push({t:"num",v:parseFloat(line.slice(i,j)),ln});i=j;continue}
    if(isA(c)){let j=i;while(j<line.length&&isAN(line[j]))j++;T.push({t:"name",v:line.slice(i,j),ln});i=j;continue}
    if(c==='"'||c==="'"){const q=c;let j=i+1,s="";while(j<line.length&&line[j]!==q){s+=line[j];j++}
      if(j>=line.length)throw{ln,msg:"Te faltó cerrar la comilla"};T.push({t:"str",v:s,ln});i=j+1;continue}
    const two=line.slice(i,i+2);
    if(["==","!=","<=",">=","//"].includes(two)){T.push({t:"op",v:two,ln});i+=2;continue}
    if("+-*/%<>=(),:".includes(c)){T.push({t:"op",v:c,ln});i++;continue}
    throw{ln,msg:`No entiendo el símbolo "${c}"`};
  }
  return T;
}
function P(T,ln){
  let i=0;
  const peek=()=>T[i], eat=v=>{if(T[i]&&T[i].v===v){i++;return true}return false};
  const expect=v=>{if(!eat(v))throw{ln,msg:`Esperaba "${v}" acá`}};
  function or_(){let l=and_();while(peek()&&(peek().v==="or"||peek().v==="o")){i++;l={k:"log",op:"or",l,r:and_()}}return l}
  function and_(){let l=not_();while(peek()&&(peek().v==="and"||peek().v==="y")){i++;l={k:"log",op:"and",l,r:not_()}}return l}
  function not_(){if(peek()&&(peek().v==="not"||peek().v==="no")){i++;return{k:"not",e:not_()}}return cmp_()}
  function cmp_(){let l=add_();while(peek()&&["==","!=","<=",">=","<",">"].includes(peek().v)){const o=T[i++].v;l={k:"cmp",op:o,l,r:add_()}}return l}
  function add_(){let l=mul_();while(peek()&&(peek().v==="+"||peek().v==="-")){const o=T[i++].v;l={k:"bin",op:o,l,r:mul_()}}return l}
  function mul_(){let l=un_();while(peek()&&["*","/","%","//"].includes(peek().v)){const o=T[i++].v;l={k:"bin",op:o,l,r:un_()}}return l}
  function un_(){if(peek()&&peek().v==="-"){i++;return{k:"neg",e:un_()}}return pri_()}
  function pri_(){
    const t=peek();
    if(!t)throw{ln,msg:"La línea quedó incompleta"};
    if(t.t==="num"){i++;return{k:"num",v:t.v}}
    if(t.t==="str"){i++;return{k:"str",v:t.v}}
    if(t.v==="("){i++;const e=or_();expect(")");return e}
    if(t.t==="name"){i++;
      if(peek()&&peek().v==="("){i++;const args=[];
        if(!(peek()&&peek().v===")")){args.push(or_());while(eat(","))args.push(or_())}
        expect(")");return{k:"call",n:t.v,args,ln}}
      return{k:"var",n:t.v,ln}}
    throw{ln,msg:`No esperaba "${t.v}" acá`};
  }
  const e=or_();
  if(i<T.length)throw{ln,msg:`Sobra "${T[i].v}" al final de la línea`};
  return e;
}
function parsePy(src){
  const raw=src.replace(/\r/g,"").split("\n");
  const L=[];
  raw.forEach((s,k)=>{const noC=s.split("#")[0];
    if(!noC.trim())return;
    L.push({ind:(s.match(/^[ \t]*/)[0].replace(/\t/g,"    ")).length,txt:noC.trim(),ln:k+1})});
  let p=0;
  function block(minInd){
    const out=[];
    while(p<L.length&&L[p].ind>=minInd){
      if(L[p].ind>minInd)throw{ln:L[p].ln,msg:"Esta línea tiene demasiada sangría"};
      out.push(stmt(minInd));
    }
    return out;
  }
  function body(cur,ln){
    if(p>=L.length||L[p].ind<=cur)throw{ln,msg:"Después de los dos puntos falta el bloque indentado (4 espacios)"};
    return block(L[p].ind);
  }
  function stmt(cur){
    const l=L[p], t=l.txt, ln=l.ln;
    const head=(kw)=>t===kw||t.startsWith(kw+" ")||t.startsWith(kw+"(");
    if(head("if")||head("while")){
      const kw=head("if")?"if":"while";
      if(!t.endsWith(":"))throw{ln,msg:`Al final del ${kw} falta los dos puntos ":"`};
      const cond=P(tk(t.slice(kw.length,-1),ln),ln);p++;
      const b=body(cur,ln);
      if(kw==="while")return{k:"while",cond,b,ln};
      const node={k:"if",arms:[{cond,b}],els:null,ln};
      while(p<L.length&&L[p].ind===cur&&(L[p].txt.startsWith("elif ")||L[p].txt==="else:"||L[p].txt.startsWith("else:"))){
        const e=L[p];
        if(e.txt.startsWith("elif")){
          if(!e.txt.endsWith(":"))throw{ln:e.ln,msg:'Al final del elif falta los dos puntos ":"'};
          const c2=P(tk(e.txt.slice(4,-1),e.ln),e.ln);p++;node.arms.push({cond:c2,b:body(cur,e.ln)});
        }else{p++;node.els=body(cur,e.ln);break}
      }
      return node;
    }
    if(head("for")){
      const m=t.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\((.+)\)\s*:$/);
      if(!m)throw{ln,msg:'El for se escribe así:  for i in range(5):'};
      const n=P(tk(m[2],ln),ln);p++;return{k:"for",v:m[1],n,b:body(cur,ln),ln};
    }
    if(t.startsWith("else")||t.startsWith("elif"))throw{ln,msg:`"${t.split(" ")[0]}" sin un if arriba`};
    const eq=t.search(/(?<![=!<>])=(?!=)/);
    if(eq>0&&/^[A-Za-z_]\w*\s*$/.test(t.slice(0,eq))){
      const name=t.slice(0,eq).trim(), e=P(tk(t.slice(eq+1),ln),ln);p++;return{k:"set",n:name,e,ln};
    }
    const e=P(tk(t,ln),ln);p++;
    if(e.k!=="call")throw{ln,msg:"Esta línea no hace nada. ¿Te faltó una orden o un = ?"};
    return{k:"exp",e,ln};
  }
  const prog=block(0);
  if(p<L.length)throw{ln:L[p].ln,msg:"No entiendo la sangría de esta línea"};
  return prog;
}

const LEDS=[{p:4,c:"#f87171",l:"rojo"},{p:5,c:"#fbbf24",l:"amarillo"},{p:6,c:"#34d399",l:"verde"},
            {p:8,c:"#38bdf8",l:"bomba"},{p:9,c:"#f472b6",l:"buzzer"},{p:13,c:"#e2e8f0",l:"LED placa"}];
let SIM={pins:{},an:{A0:512},out:[],vars:{},trans:0,servo:null};
let RUN={stop:true,live:false};
function simReset(keepAn){const a=keepAn?SIM.an:{A0:512};SIM={pins:{},an:a,out:[],vars:{},trans:0,servo:null}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function execPy(prog,ctx){
  const env=ctx.env;
  let steps=0, vt=0;
  const bump=()=>{if(++steps>ctx.maxSteps)throw{ln:0,msg:"El programa hizo demasiadas cosas. ¿Un bucle sin esperar()?"}};
  async function ev(n){
    bump();
    switch(n.k){
      case "num":return n.v;
      case "str":return n.v;
      case "var":{
        if(/^A[0-5]$/.test(n.n))return n.n;
        if(n.n==="True")return true; if(n.n==="False")return false;
        if(!(n.n in env))throw{ln:n.ln,msg:`La variable "${n.n}" todavía no existe. ¿La escribiste distinto arriba?`};
        return env[n.n]}
      case "neg":return -(await ev(n.e));
      case "not":return !(await ev(n.e));
      case "log":{const l=await ev(n.l);
        if(n.op==="and")return l?await ev(n.r):l; return l?l:await ev(n.r)}
      case "cmp":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "==":return a===b;case "!=":return a!==b;case "<":return a<b;
          case ">":return a>b;case "<=":return a<=b;case ">=":return a>=b}}
      case "bin":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "+":return (typeof a==="string"||typeof b==="string")?String(a)+String(b):a+b;
          case "-":return a-b;case "*":return a*b;
          case "/":{if(b===0)throw{ln:n.ln,msg:"No se puede dividir por cero"};return a/b}
          case "//":return Math.floor(a/b);case "%":return a%b}}
      case "call":return await call(n);
    }
  }
  async function call(n){
    const a=[];for(const x of n.args)a.push(await ev(x));
    const need=(k)=>{if(a.length<k)throw{ln:n.ln,msg:`A ${n.n}() le faltan datos adentro del paréntesis`}};
    switch(n.n){
      case "prender":{need(1);const p=+a[0];if(SIM.pins[p]!==1)SIM.trans++;SIM.pins[p]=1;ctx.paint();return null}
      case "apagar":{need(1);const p=+a[0];if(SIM.pins[p]===1)SIM.trans++;SIM.pins[p]=0;ctx.paint();return null}
      case "leer":{need(1);const p=a[0];const v=SIM.an[p];
        if(v===undefined)throw{ln:n.ln,msg:`No hay ningún sensor en ${p}. Probá con A0`};return v}
      case "mostrar":{need(1);SIM.out.push(String(typeof a[0]==="number"?Math.round(a[0]*100)/100:a[0]));
        if(SIM.out.length>200)SIM.out.shift();ctx.paint();return null}
      case "servo":{need(2);SIM.servo=+a[1];ctx.paint();return null}
      case "esperar":{need(1);const s=Math.max(0,+a[0]);
        if(ctx.live){await sleep(Math.min(s,3)*1000)}else{vt+=s;if(vt>ctx.maxVT)throw{stopok:true}}
        return null}
      case "redondear":{need(1);return Math.round(a[0])}
      case "range":throw{ln:n.ln,msg:"range() solo se usa adentro de un for"};
      default:throw{ln:n.ln,msg:`No conozco la orden "${n.n}()". Mirá la lista de órdenes abajo.`};
    }
  }
  async function block(b){for(const s of b){if(RUN.stop&&ctx.live)throw{stopok:true};await run1(s)}}
  async function run1(s){
    bump();
    switch(s.k){
      case "set":{env[s.n]=await ev(s.e);SIM.vars=Object.assign({},env);ctx.paint();return}
      case "exp":await ev(s.e);return;
      case "if":{for(const arm of s.arms){if(await ev(arm.cond))return await block(arm.b)}
        if(s.els)return await block(s.els);return}
      case "while":{let guard=0;
        while(await ev(s.cond)){
          await block(s.b);
          if(ctx.live){await sleep(0)}else{vt+=0.001;if(vt>ctx.maxVT)throw{stopok:true}}
          if(RUN.stop&&ctx.live)throw{stopok:true};
          if(++guard>ctx.maxLoop)throw{stopok:true};
        }return}
      case "for":{const n=Math.min(+(await ev(s.n)),ctx.maxLoop);
        for(let k=0;k<n;k++){env[s.v]=k;SIM.vars=Object.assign({},env);await block(s.b);
          if(ctx.live){await sleep(0)}
          if(RUN.stop&&ctx.live)throw{stopok:true}}
        return}
    }
  }
  await block(prog);
}

/* corre el código; devuelve {err, pins, out, trans, servo} */
async function roboRun(code,opt){
  opt=opt||{};
  const live=!!opt.live;
  simReset(!!opt.keepAn);
  if(opt.an)SIM.an=Object.assign({},SIM.an,opt.an);
  const ctx={env:{},live,paint:live?roboPaint:()=>{},maxSteps:live?4e6:2e5,maxVT:opt.maxVT||14,maxLoop:live?1e9:4000};
  RUN.stop=false;RUN.live=live;
  let err=null;
  try{
    const prog=parsePy(code);
    if(!prog.length)err={ln:0,msg:"Todavía no escribiste ninguna orden."};
    else await execPy(prog,ctx);
  }catch(e){ if(!e||!e.stopok) err=(e&&e.msg)?e:{ln:0,msg:"Algo salió mal: "+(e&&e.message||e)} }
  RUN.stop=true;
  if(live)roboPaint();
  return {err,pins:Object.assign({},SIM.pins),out:SIM.out.slice(),trans:SIM.trans,servo:SIM.servo};
}

const MIS=[

{t:"¿Cuánto mide el sensor?",c:"variable · leer()",

    typeof SIM.vars[k]==="number"?Math.round(SIM.vars[k]*100)/100:SIM.vars[k]}</span>`).join("");
}
function edKeys(e){
  const ta=e.target;
  if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;
    ta.value=ta.value.slice(0,s)+"    "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+4;return}
  if(e.key==="Enter"){e.preventDefault();
    const s=ta.selectionStart,before=ta.value.slice(0,s);
    const line=before.slice(before.lastIndexOf("\n")+1);
    let ind=(line.match(/^[ \t]*/)||[""])[0];
    if(/:\s*$/.test(line))ind+="    ";
    const ins="\n"+ind;
    ta.value=before+ins+ta.value.slice(ta.selectionEnd);
    ta.selectionStart=ta.selectionEnd=s+ins.length;}
}
function edCode(){const e=document.getElementById("ed");if(e)localStorage.setItem(RKEY+"_code_"+RM,e.value);return e?e.value:""}
function fb(html){const f=document.getElementById("fb");if(f)f.innerHTML=html}
function errHTML(e){return `<div class="err"><b>${e.ln?`Línea ${e.ln}: `:""}</b>${e.msg}</div>`}

async function roboGo(){
  const code=edCode();
  fb(`<div class="muted" style="margin-top:8px">Ejecutando… <span class="run-dots"></span></div>`);
  const r=await roboRun(code,{live:true,keepAn:true});
  fb(r.err?errHTML(r.err):"");
}
function roboStop(){RUN.stop=true}
async function roboCheck(){
  const code=edCode(), m=MIS[RM];
  fb(`<div class="muted" style="margin-top:8px">Comprobando… <span class="run-dots"></span></div>`);
  let firstErr=null;
  const runner=async o=>{const r=await roboRun(code,Object.assign({live:false},o));if(r.err&&!firstErr)firstErr=r.err;return r};
  let res;
  try{res=await m.chk(runner)}catch(e){res={ok:false,msg:"No pude comprobarlo."}}
  if(firstErr){fb(errHTML(firstErr));return}
  if(res.ok){
    if(!RDONE.includes(RM)){RDONE.push(RM);rsave()}
    fb(`<div class="verdict ok">¡Listo! ${res.msg}</div>
        ${RM+1<MIS.length?`<button class="btn" onclick="roboMis(${RM+1})">Siguiente misión →</button>`
          :`<button class="btn" onclick="roboHome()">Terminaste las siete. Volver</button>`}`);
  }else{
    fb(`<div class="verdict no">Todavía no. ${res.msg}</div>`);
  }
  simReset(true);roboPaint();
}

const IST=[
{t:"Explorando robótica",k:"Empieza un tema nuevo",h:`
  <div class="big">Durante estos meses estuvimos trabajando con <b>datos</b>: armar una tabla,
  hacerle preguntas, distinguir un dato de una opinión.<br><br>
  Hoy abrimos un tema nuevo, que en algún punto se cruza con eso: la <b>robótica</b>.<br><br>
  Antes de tocar nada ni programar nada, la clase de hoy es para entender de qué estamos hablando:
  qué es un robot y qué no, de dónde viene la idea, cómo está hecho uno por dentro,
  y qué tiene que ver todo esto con la electricidad.</div>
  <div class="hint" style="margin-top:16px">Hoy no hay que saber nada previo. Es una clase para mirar,
  discutir y preguntar.</div>`},

{t:"Antes que nada",k:"Preguntas para pensar",h:`
  <div class="big">No contesten rápido. Piensen y discutan.</div>
  <div class="qlist">
    <div>¿Un lavarropas es un robot?</div>
    <div>¿Y un semáforo?</div>
    <div>¿Y un ascensor?</div>
    <div>¿Y ChatGPT?</div>
    <div>¿Y una puerta que se abre sola en el súper?</div>
  </div>
  <div class="hint" style="margin-top:14px">Si hay desacuerdo, mejor. Guarden el argumento.</div>`},

{act:1,t:"Actividad 1",k:"¿Es un robot?"},

{t:"Qué es un robot",k:"Definición",h:`
  <div class="big">Casi todas las definiciones coinciden en tres cosas. Un robot es una máquina que:</div>
  <div class="flow">
    <div class="fnode i"><div class="fh">SENSA</div><div class="fs">recibe información del mundo</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">DECIDE</div><div class="fs">procesa esa información y elige qué hacer</div></div>
    <div class="farr">→</div>
    <div class="fnode o"><div class="fh">ACTÚA</div><div class="fs">hace algo que cambia el mundo</div></div>
  </div>
  <div class="big">Y lo repite en un <b>bucle</b>, todo el tiempo.<br><br>
  Si le sacás el "decide", no es un robot: es un <b>automatismo</b>. Una puerta corrediza sensa y actúa,
  pero no elige nada, siempre hace lo mismo.<br><br>
  Esas tres palabras no dicen nada de que tenga forma humana, ni patas, ni que hable.
  <b>Eso lo puso el cine, no la ingeniería.</b></div>`},

{t:"De dónde viene todo esto",k:"Línea histórica",h:`
  <div class="tl">
   <div class="tli"><div class="y">~350 a.C.</div><div class="d"><b>La paloma de Arquitas.</b> Un pájaro de madera
     que volaba impulsado por vapor. El primer autómata del que hay registro.</div></div>
   <div class="tli"><div class="y">Siglo I</div><div class="d"><b>Herón de Alejandría</b> diseña puertas de templo
     que se abrían solas y máquinas que servían vino. Todo con agua, aire y contrapesos.</div></div>
   <div class="tli"><div class="y">1206</div><div class="d"><b>Al-Jazari</b>, ingeniero árabe, construye autómatas
     que se podían <b>reprogramar</b> cambiando clavijas. Un barco con músicos que tocaban distintos ritmos.
     Es la idea de programa, seiscientos años antes de la computadora.</div></div>
   <div class="tli"><div class="y">1739</div><div class="d"><b>El pato de Vaucanson.</b> Un pato mecánico que comía,
     movía las alas y hacía caca. Fue un fraude parcial, pero enloqueció a toda Europa.</div></div>
   <div class="tli"><div class="y">1804</div><div class="d"><b>El telar de Jacquard.</b> Tejía dibujos distintos según
     unas <b>tarjetas perforadas</b>. La misma máquina, distinto resultado, según las instrucciones que le pongas.
     Esto es literalmente software antes del software.</div></div>
   <div class="tli"><div class="y">1898</div><div class="d"><b>Tesla</b> muestra un barquito por radiocontrol en Nueva York.
     La gente creyó que había magia adentro.</div></div>
   <div class="tli"><div class="y">1920</div><div class="d"><b>Nace la palabra "robot"</b>, en una obra de teatro del
     checo Karel Čapek. Viene de <i>robota</i>: trabajo forzado. En la obra, los robots se rebelan.
     La palabra nació con miedo adentro.</div></div>
   <div class="tli"><div class="y">1942</div><div class="d"><b>Asimov</b> escribe las tres leyes de la robótica.
     No son leyes reales, son literatura, pero todavía se discuten.</div></div>
   <div class="tli"><div class="y">1961</div><div class="d"><b>Unimate</b>, el primer robot industrial, empieza a
     trabajar en una fábrica de General Motors levantando piezas de metal calientes. El trabajo que quemaba a la gente.</div></div>
   <div class="tli"><div class="y">1969</div><div class="d"><b>Shakey.</b> El primer robot que no solo se movía:
     armaba un plan de qué hacer. Tardaba horas en decidir cómo cruzar una habitación.</div></div>
   <div class="tli"><div class="y">2002</div><div class="d"><b>Roomba.</b> El primer robot que entró de verdad
     a las casas. Se vendieron millones.</div></div>
   <div class="tli"><div class="y">2005</div><div class="d"><b>Arduino</b>, en Ivrea, Italia. Una placa barata y
     <b>de hardware libre</b>: los planos son públicos, cualquiera puede fabricarla o modificarla.
     Antes de Arduino, esto era para ingenieros. Después, para cualquiera. <b>Es la placa que vamos a usar.</b></div></div>
   <div class="tli"><div class="y">Hoy</div><div class="d">Drones que fumigan campos, robots que ordeñan vacas,

  </div>`},

{t:"Curiosidades",k:"Para saber",h:`
  <div class="cur"><b>Robot</b> viene de <i>robota</i>, que en checo significa <b>trabajo forzado</b>, casi esclavitud.
    La palabra nació en 1920 en una obra de teatro donde los robots terminan rebelándose.</div>
  <div class="cur"><b>Arduino se llama así por un bar.</b> El Bar di Re Arduino, en Ivrea, donde se juntaban los que
    la inventaron. Y el bar se llamaba así por Arduino de Ivrea, un rey medieval.</div>
  <div class="cur"><b>La Roomba viene de la guerra.</b> La empresa que la hizo desarrollaba robots para

  <div class="cur"><b>El celular que tienen en el bolsillo</b> tiene más sensores que muchos robots industriales:
    acelerómetro, giróscopo, luz, proximidad, magnetómetro, GPS, micrófono, cámaras.</div>
  <div class="cur"><b>Casi ningún robot real tiene forma humana.</b> La mayoría son brazos atornillados al piso.
    Darle forma de persona a una máquina casi siempre es una mala decisión de ingeniería.</div>`},

{t:"Hardware y software",k:"La distinción que ordena todo",h:`
  <div class="two">
    <div class="box"><h4>Hardware</h4><ul>
      <li>Lo que se puede tocar</li><li>La placa, los cables, el sensor</li>
      <li>El motor, la lamparita, la batería</li><li>Si se rompe, se cambia</li></ul></div>
    <div class="box"><h4>Software</h4><ul>
      <li>Las instrucciones</li><li>No pesa, no se toca</li>
      <li>Se copia infinitas veces sin gastarse</li><li>Si está mal, se corrige y listo</li></ul></div>
  </div>
  <div class="big"><br>
  El mismo hardware, con distinto software, <b>es un aparato distinto</b>.<br><br>
  La misma placa con los mismos cables puede ser un regador automático o una alarma de heladas.
  No cambia nada físico. Cambia el programa.<br><br>
  Por eso el telar de Jacquard de 1804 ya era importante: era la misma máquina tejiendo dibujos distintos
  según las tarjetas que le pusieras.</div>`},

{act:2,t:"Actividad 2",k:"¿Hardware o software?"},

{t:"Cómo está hecho por dentro",k:"Los tres bloques",h:`
  <div class="big">Cualquier sistema robótico, desde el más simple hasta un auto autónomo, tiene estas partes:</div>
  <div class="flow">
    <div class="fnode i"><div class="fh">ENTRADA</div><div class="fs">SENSORES<br>miden algo del mundo</div></div>
    <div class="farr">→</div>
    <div class="fnode p"><div class="fh">PROCESAMIENTO</div><div class="fs">MICROCONTROLADOR<br>corre tu programa y decide</div></div>
    <div class="farr">→</div>
    <div class="fnode o"><div class="fh">SALIDA</div><div class="fs">ACTUADORES<br>hacen algo en el mundo</div></div>
  </div>
  <div class="big">Más una cuarta que se olvida siempre y sin la cual nada funciona: la <b>alimentación</b>.
  De algún lado tiene que salir la energía. Un cable USB, una pila, un powerbank.</div>
  <div class="hint">Si esto les suena, es porque es lo mismo que vimos con los datos:
  entra información, se procesa, sale un resultado. Es el mismo esquema.</div>`},

{t:"Sensores",k:"Los sentidos de la máquina",h:`
  <div class="big">Un <b>sensor</b> convierte algo del mundo físico en un número que la placa puede leer.
  Eso es todo lo que hace. Traduce.</div>
  <div class="two" style="margin-top:14px">
    <div class="box"><h4>Los que vamos a usar</h4><ul>
      <li><b>Humedad de suelo:</b> cuánta agua tiene la tierra</li>
      <li><b>Temperatura y humedad del aire</b></li>
      <li><b>Luz (LDR):</b> cuánta claridad hay</li>
      <li><b>Botón:</b> apretado o no apretado</li></ul></div>
    <div class="box"><h4>Otros que existen</h4><ul>
      <li>Distancia por ultrasonido</li><li>Movimiento</li><li>Inclinación y aceleración</li>
      <li>Gases, humo, calidad del aire</li><li>Sonido</li></ul></div>
  </div>
  <div class="big" style="margin-top:14px">Un sensor <b>no entiende</b> lo que mide. El sensor de humedad no sabe
  qué es la tierra ni qué es una planta. Devuelve un número. <b>El significado se lo ponemos nosotros en el programa.</b></div>`},

{t:"Actuadores",k:"Cómo la máquina toca el mundo",h:`
  <div class="big">Un <b>actuador</b> es lo contrario del sensor: convierte una orden eléctrica en algo que pasa.</div>
  <div class="two" style="margin-top:14px">
    <div class="box"><h4>Simples</h4><ul>
      <li><b>LED:</b> una lucecita. Sirve para avisar</li>
      <li><b>Buzzer:</b> hace ruido. Alarma</li>
      <li><b>Display:</b> muestra un número o texto</li></ul></div>
    <div class="box"><h4>Con fuerza</h4><ul>
      <li><b>Servo:</b> gira a un ángulo exacto. Abrir una ventanita</li>
      <li><b>Motor:</b> gira y gira. Ruedas</li>
      <li><b>Relé:</b> un interruptor que la placa maneja. Con esto se prende una bomba de agua de verdad</li></ul></div>
  </div>
  <div class="hint">El relé es la pieza clave de cualquier riego automático: la placa maneja 5 voltios y una bomba
  necesita mucho más. El relé es el intermediario entre los dos mundos.</div>`},

{t:"Un poco de electricidad",k:"Lo mínimo para no quemar nada",h:`
  <div class="big">La electricidad es difícil de imaginar porque no se ve. La analogía del agua funciona bastante bien:</div>
  <div class="water">
    <div class="hd">Concepto</div><div class="hd">En el agua</div><div class="hd">En electricidad</div>
    <div class="cc"><b>Tensión</b><br><span class="muted">voltios (V)</span></div>
    <div class="cc">La presión del agua</div><div class="cc">Cuánto empuja. 5 V, 3,3 V, 220 V</div>
    <div class="cc"><b>Corriente</b><br><span class="muted">amperes (A)</span></div>
    <div class="cc">Cuánta agua pasa por segundo</div><div class="cc">Cuántos electrones pasan. Esto es lo que quema cosas</div>
    <div class="cc"><b>Resistencia</b><br><span class="muted">ohms (Ω)</span></div>
    <div class="cc">Lo angosto del caño</div><div class="cc">Cuánto se le opone al paso</div>
  </div>
  <div class="big" style="margin-top:16px"><br>
  <b>1. El circuito tiene que cerrarse.</b> La corriente sale, hace su trabajo y tiene que volver.
  Si el camino está abierto, no pasa absolutamente nada. Por eso siempre hay un cable a GND (tierra).<br><br>
  <b>2. Un LED necesita una resistencia.</b> Solo, se toma toda la corriente que puede y se quema en segundos.
  La resistencia es el caño angosto que lo cuida.<br><br>
  <b>3. Cada placa trabaja a su voltaje.</b> El Arduino a 5 V. Otras a 3,3 V.
  Si le metés 5 V a una placa de 3,3 V, la rompés. Por eso vamos a usar Arduino: nuestros sensores son de 5 V.</div>`},

{t:"Digital y analógico",k:"Dos maneras de leer el mundo",h:`
  <div class="two">
    <div class="box"><h4>Digital</h4>
      <div class="big" style="font-size:.95rem">Solo dos estados posibles: <b>0 o 1</b>. Apagado o prendido.
      Sí o no.<br><br>Un botón es digital: está apretado o no está apretado. No hay medio apretado.</div></div>
    <div class="box"><h4>Analógico</h4>
      <div class="big" style="font-size:.95rem">Un valor dentro de un rango.
      En Arduino, un número entre <b>0 y 1023</b>.<br><br>La humedad de la tierra es analógica:
      puede estar seca, un poco húmeda, empapada, y todo lo que hay en el medio.</div></div>
  </div>
  <div class="big" style="margin-top:14px">Ese número entre 0 y 1023 va a ser importante.
  Cuando lean el sensor de humedad no van a recibir "húmedo", van a recibir <b>743</b>.<br><br>
  Y ahí va a haber que convertirlo a algo que se entienda, por ejemplo un porcentaje.
  <b>Esa conversión es una función lineal</b>, la misma que están viendo en Matemática.</div>`},

{t:"Ejemplos de placas",k:"El zoológico",h:`
  <div class="plc">
    <div class="p1"><div class="pn2">Arduino Uno / Nano</div>
      <div class="pd">La clásica. Trabaja a 5 V, es hardware libre, es barata y hay tutoriales de todo.

      <li><b>Regulador de voltaje.</b> Le baja la tensión a 5 V, entre como entre.</li>
      <li><b>Pines de alimentación.</b> 5 V, 3,3 V, GND (tierra) y Vin. De acá salen los cables que alimentan los sensores.</li>
      <li><b>Pines analógicos, A0 a A5.</b> Seis. Leen un número entre 0 y 1023. Acá va el sensor de humedad.</li>
      <li><b>El microcontrolador, ATmega328P.</b> Es el cerebro: acá adentro vive tu programa. 16 MHz, 32 KB de memoria.</li>
      <li><b>ICSP.</b> Para grabarle el arranque de fábrica. No lo vamos a tocar.</li>
      <li><b>LED de encendido.</b> Si está prendido, la placa tiene corriente.</li>
      <li><b>LEDs TX y RX.</b> Parpadean cuando la placa manda o recibe datos por el USB.</li>
      <li><b>Pines digitales.</b> Catorce, del 0 al 13. Solo entienden dos estados: prendido o apagado.</li>
      <li><b>Los que tienen ~ son PWM.</b> Seis de los catorce (3, 5, 6, 9, 10 y 11). Pueden simular valores intermedios: media luz, medio motor.</li>
      <li><b>Chip USB-serie.</b> Traduce entre el lenguaje del USB y el del microcontrolador.</li>
      <li><b>Botón de reset.</b> Reinicia el programa desde cero.</li>

{t:"Dónde se cruza con lo que veníamos haciendo",k:"El hilo",h:`
  <div class="big">
  Estos meses aprendimos a estructurar datos en tablas, a distinguir tipos de datos, a hacerle preguntas
  a un conjunto de datos y a no confundir lo que se observa con lo que se interpreta.<br><br>
  Pero hubo una pregunta que quedó siempre dando vueltas: <b>¿de dónde salen los datos?</b><br><br>
  Los que usamos los había medido otro. Y medir nosotros, a mano, una vez por semana, era lentísimo.<br><br>
  Acá aparece el cruce: <b>un sensor es una máquina de producir datos.</b> Mide solo, todo el tiempo,
  sin cansarse y sin olvidarse. Cada número que vimos en una tabla alguna vez salió de algún lado,
  y muchas veces salió de algo parecido a esto.</div>
  <div class="hint" style="margin-top:16px">Eso es lo que vamos a ir explorando en las próximas clases:
  cómo se le dan órdenes a una placa, empezando por lo más simple.</div>`},

/* etiquetas cortas para el índice lateral */
const NAVL=["Apertura","Preguntas para pensar","Actividad 1","Qué es un robot","Línea histórica",
 "Curiosidades","Hardware y software","Actividad 2","Cómo está hecho","Sensores","Actuadores",

 "El hilo con los datos","Cierre"];

let CURI=-1;
function roboMode(on){
  const w=document.querySelector(".wrap");
  if(on){document.body.classList.add("robo");if(w)w.classList.add("wide")}
  else{document.body.classList.remove("robo");if(w)w.classList.remove("wide");CURI=-1}
}
function isideHTML(cur){
  const items=IST.map((s,i)=>`<div class="iso ${i===cur?"cur":""} ${s.act?"isact":""}" onclick="introGo(${i})">
      <span class="isn">${i+1}</span><span>${NAVL[i]||s.t}</span></div>`).join("");
  return `<aside class="iside">
    <div class="sh">Introducción a la robótica</div>
    ${items}
    <div class="isidefoot">
      <a onclick="roboHome()">← Salir de la introducción</a>
      <a onclick="portal()">Ir al panel general</a>
    </div></aside>`;
}
function ilay(cur,inner){return `<div class="ilay">${isideHTML(cur)}<div>${inner}</div></div>`}

function introGo(i){
  fichaBtn.style.display="none"; roboMode(true);
  if(i<0)i=0; if(i>=IST.length)return roboHome();
  const s=IST[i];
  setHead("Introducción a la robótica",`${i+1} de ${IST.length}`);
  if(s.act){CURI=-1;return [null,act1,act2,act3][s.act](i)}
  CURI=i;
  app.innerHTML=ilay(i,`<div class="icard">
    <div class="topbar"><i style="width:${(i+1)/IST.length*100}%"></i></div>
    <div class="kicker">${s.k}</div>
    <h2 class="ih">${s.t}</h2>
    ${s.h}
    ${introNav(i)}
    <div class="kbhint">Podés avanzar con las flechas del teclado</div>
  </div>`);
  window.scrollTo(0,0);
}
function introNav(i){return `<div class="navb">
  ${i>0?`<button class="btn ghost" onclick="introGo(${i-1})">← Anterior</button>`:""}
  <button class="btn" onclick="introGo(${i+1})">${i+1>=IST.length?"Terminar":"Siguiente →"}</button></div>`}

if(typeof document.addEventListener==="function")document.addEventListener("keydown",e=>{
  if(CURI<0)return;
  const t=(e.target&&e.target.tagName)||"";
  if(t==="INPUT"||t==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();introGo(CURI+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();introGo(CURI-1)}
});

/* ---------------- ACTIVIDAD 1: ¿Es un robot? ---------------- */
const A1=[
 {q:"Un lavarropas",r:true,e:"Sí, aunque no lo parezca. Sensa (cuánta agua hay, cuánto pesa la ropa), decide (elige el programa, si carga más agua) y actúa (gira, calienta, desagota). Cumple los tres pasos."},
 {q:"Un semáforo común",r:false,e:"No. Actúa (cambia las luces) pero no sensa nada ni decide: repite la misma secuencia por tiempo, pase lo que pase. Es un automatismo. Ojo: un semáforo inteligente que mide el tránsito y se adapta, sí sería un robot."},
 {q:"Un dron que sigue una ruta y esquiva árboles",r:true,e:"Sí, clarísimo. Sensa (GPS, cámaras, distancia), decide (recalcula la ruta) y actúa (cambia el rumbo)."},
 {q:"ChatGPT",r:false,e:"No, aunque sea muy sofisticado. Le falta el cuerpo: no sensa el mundo físico ni actúa sobre él. Es un programa, no un robot. Un robot necesita estar metido en el mundo."},
 {q:"Una puerta corrediza de supermercado",r:false,e:"No. Sensa (detecta que te acercás) y actúa (abre), pero no decide nada: siempre hace exactamente lo mismo. Le falta el paso del medio."},
 {q:"Una Roomba",r:true,e:"Sí. Sensa (choques, suciedad, escalones), decide (arma el recorrido, vuelve a cargar) y actúa (se mueve y aspira)."},
 {q:"Un reloj despertador",r:false,e:"No. Mide el tiempo y suena a la hora fijada. No hay decisión, hay una condición programada de fábrica que siempre es la misma."},
 {q:"Un riego automático que mide la tierra y decide si abrir el agua",r:true,e:"Sí. Sensa (la humedad de la tierra), decide (si está seca o no) y actúa (abre o no el agua). Los tres pasos. Y es de los más simples de la lista: un robot no necesita ser complicado."}
];
let A1i=0,A1s=0,A1step=null;
function act1(idx){
  A1i=0;A1s=0;A1step=idx;a1r();
}
function a1r(fbk){
  const it=A1[A1i];
  setHead("Actividad 1","¿Es un robot?");
  app.innerHTML=ilay(A1step,`<div class="icard narrow">
    <div class="topbar"><i style="width:${(A1i+(fbk?1:0))/A1.length*100}%"></i></div>
    <div class="kicker">Actividad 1 · ¿es un robot? · <span class="score">${A1i} de ${A1.length}</span></div>
    <h2 class="ih" style="font-size:1.75rem">${it.q}</h2>
    <p class="muted">Acordate: tiene que <b>sensar</b>, <b>decidir</b> y <b>actuar</b>. Los tres.</p>
    <div class="achoice">
      <button ${fbk?"":`onclick="a1a(true)"`} class="${fbk?(it.r?"ok":(fbk.pick===true?"no":"")):""}">Sí, es un robot</button>
      <button ${fbk?"":`onclick="a1a(false)"`} class="${fbk?(!it.r?"ok":(fbk.pick===false?"no":"")):""}">No, no lo es</button>
    </div>
    ${fbk?`<div class="expl"><b>${fbk.ok?"Bien. ":"Casi. "}</b>${it.e}</div>
      <div class="navb"><button class="btn" onclick="a1n()">${A1i+1>=A1.length?"Ver el resultado →":"Siguiente →"}</button></div>`:""}
  </div>`);
  window.scrollTo(0,0);
}
function a1a(p){const ok=p===A1[A1i].r;if(ok)A1s++;a1r({ok,pick:p})}
function a1n(){A1i++;
  if(A1i>=A1.length){
    setHead("Actividad 1","resultado");
    CURI=A1step;
    app.innerHTML=ilay(A1step,`<div class="icard narrow">
      <div class="kicker">Actividad 1 terminada</div>
      <h2 class="ih">${A1s} de ${A1.length}</h2>
      <div class="big">Lo importante no es el puntaje. Es que la palabra "robot" es más borrosa de lo que parece,
      y que el filtro que sirve es el del medio: <b>¿decide algo, o siempre hace lo mismo?</b><br><br>
      La mayoría de las máquinas que nos rodean sensan y actúan. Muy pocas deciden.</div>
      ${introNav(A1step)}</div>`);
    return}
  a1r();
}

/* ---------------- ACTIVIDAD 2: hardware o software ---------------- */
const A2=[
 {q:"El cable USB",r:"h",e:"Hardware. Se toca, se rompe, se reemplaza."},

      <button ${fbk?"":`onclick="a2a('s')"`} class="${fbk?(it.r==="s"?"ok":(fbk.pick==="s"?"no":"")):""}">Software — son instrucciones</button>
    </div>
    ${fbk?`<div class="expl"><b>${fbk.ok?"Bien. ":"Casi. "}</b>${it.e}</div>
      <div class="navb"><button class="btn" onclick="a2n()">${A2i+1>=A2.length?"Ver el resultado →":"Siguiente →"}</button></div>`:""}
  </div>`);

function a2a(p){const ok=p===A2[A2i].r;if(ok)A2s++;a2r({ok,pick:p})}

      <h2 class="ih">${A2s} de ${A2.length}</h2>
      <div class="big">La frontera no siempre es obvia, y el caso de los planos de Arduino es el más interesante:

      costaran diez mil pesos en vez de cien mil.<br><br>
      Y no se olviden de lo central: <b>mismo hardware + distinto software = otro aparato.</b></div>
      ${introNav(A2step)}</div>`);
